<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Forge Academy: free, complete career roadmaps for 9 tech roles with notes, hands-on labs, quizzes and projects. Frontend, backend, full-stack, AI, DevOps, cybersecurity, data and mobile.">
<meta property="og:title" content="Forge Academy: find your path in tech, then walk it">
<meta property="og:description" content="Free career roadmaps with notes, hands-on labs, quizzes and projects for 9 in-demand tech roles.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Forge Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar; curriculum rail on the left (drawer on phones); one reading column for lessons. */
:root {
  --bg: #f1f3ee; --surface: #ffffff; --sunk: #e7eae3; --ink: #18201c; --muted: #5b6560; --line: #d6dbd2;
  --accent: #0e7563; --accent-ink: #ffffff; --accent-soft: #d5ece6; --mark: #f2cf4e; --mark-ink: #3d3200;
  --good: #1f7a3d; --good-soft: #dcefe1; --bad: #b3361f; --bad-soft: #f7e0da;
  --code-bg: #141a19; --code-ink: #dfe7e3; --code-line: #26302e;
  --lv1: #2f6fb3; --lv2: #0e7563; --lv3: #9a5a12; --lv4: #7a3fb0; --lv5: #b3361f;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px; --rail: 300px; --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1312; --surface: #161c1a; --sunk: #1c2421; --ink: #e4e9e6; --muted: #97a39d; --line: #2a3330;
    --accent: #3cc0a3; --accent-ink: #062019; --accent-soft: #163a32; --mark: #e6c449; --mark-ink: #2a2200;
    --good: #5cc983; --good-soft: #17301f; --bad: #f08a72; --bad-soft: #3a1d17;
    --code-bg: #0b0f0e; --code-ink: #dfe7e3; --code-line: #1f2826;
    --lv1: #7fb0ea; --lv2: #3cc0a3; --lv3: #e0a050; --lv4: #b98ae6; --lv5: #f08a72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1312; --surface: #161c1a; --sunk: #1c2421; --ink: #e4e9e6; --muted: #97a39d; --line: #2a3330;
  --accent: #3cc0a3; --accent-ink: #062019; --accent-soft: #163a32; --mark: #e6c449; --mark-ink: #2a2200;
  --good: #5cc983; --good-soft: #17301f; --bad: #f08a72; --bad-soft: #3a1d17;
  --code-bg: #0b0f0e; --code-ink: #dfe7e3; --code-line: #1f2826;
  --lv1: #7fb0ea; --lv2: #3cc0a3; --lv3: #e0a050; --lv4: #b98ae6; --lv5: #f08a72;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--f-body); }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 6px; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--sunk); padding: .08em .35em; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.eyebrow { font: 600 11.5px/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top); display: flex; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: #18201c; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 18px; height: 18px; }
.brand b { font: 800 19px/1 var(--f-display); white-space: nowrap; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.overall { flex: 1; display: flex; align-items: center; gap: 12px; justify-content: flex-end; min-width: 0; }
.overall .bar { width: min(260px, 30vw); height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.overall .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.overall span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
.theme-btn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: grid; place-items: center; }
.theme-btn svg { width: 16px; height: 16px; }

/* shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100% - var(--top)); }
.rail { border-right: 1px solid var(--line); background: var(--surface); position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 14px 12px 40px max(12px, env(safe-area-inset-left, 0px)); }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.rail-nav { display: flex; flex-direction: column; gap: 2px; margin: 12px 0 8px; }
.rail-link { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 500; font-size: 14.5px; }
.rail-link:hover, .rail-link.on { background: var(--sunk); }
.level-h { display: flex; align-items: center; gap: 8px; margin: 18px 10px 6px; }
.level-h .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lvc); }
.mod { border-radius: 8px; }
.mod > button { width: 100%; text-align: left; background: none; border: 0; display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: center; padding: 7px 8px; border-radius: 8px; font-size: 14px; }
.mod > button:hover { background: var(--sunk); }
.mod.on > button { background: var(--accent-soft); }
.mod .num { font: 600 11px/1 var(--f-mono); color: var(--muted); }
.mod .cnt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mod ol { list-style: none; margin: 2px 0 6px 32px; padding: 0; border-left: 1px solid var(--line); }
.mod li a { display: flex; gap: 8px; align-items: baseline; padding: 4px 10px; font-size: 13.5px; color: var(--muted); text-decoration: none; border-radius: 0 6px 6px 0; }
.mod li a:hover { color: var(--ink); background: var(--sunk); }
.mod li a.on { color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.tick { width: 14px; height: 14px; flex: none; border-radius: 4px; border: 1.5px solid var(--line); display: inline-grid; place-items: center; transform: translateY(2px); }
.tick.done { background: var(--mark); border-color: var(--mark); }
.tick.done::after { content: ""; width: 7px; height: 4px; border: 2px solid var(--mark-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.wide { max-width: 1080px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: end; padding: 8px 0 6px; }
.hero h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--mark) 62%, var(--mark) 92%, transparent 92%); padding: 0 .08em; color: var(--ink); }
.hero p { color: var(--muted); max-width: 58ch; margin: 12px 0 0; }
.continue { background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.continue .eyebrow { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.continue h3 { font-size: 20px; }
.continue .meta { font-size: 13px; color: color-mix(in srgb, var(--bg) 70%, transparent); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 8px; padding: 9px 15px; font-weight: 600; font-size: 14.5px; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-quiet { background: var(--sunk); color: var(--ink); }
.btn-line { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn[disabled] { opacity: .5; cursor: default; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; }
.stat b { display: block; font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.level-block { display: flex; flex-direction: column; gap: 10px; }
.level-title { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--lvc); padding-bottom: 6px; }
.level-title h2 { font-size: 20px; }
.level-title span { color: var(--muted); font-size: 13.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 15px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--lvc, var(--accent)); transform: translateY(-1px); }
.card .row { display: flex; justify-content: space-between; align-items: center; }
.card .n { font: 600 12px/1 var(--f-mono); color: var(--lvc); }
.card h3 { font-size: 17px; }
.card p { margin: 0; font-size: 13.5px; color: var(--muted); }
.mini { height: 5px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--lvc, var(--accent)); }
.path { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; counter-reset: p; }
.path a { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 500; display: flex; flex-direction: column; gap: 6px; }
.path a b { font: 600 11px/1 var(--f-mono); color: var(--muted); }

/* module & lesson */
.mod-head { display: flex; flex-direction: column; gap: 10px; }
.mod-head h1 { font-size: clamp(28px, 4vw, 40px); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--lvc); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lvc); }
.lede { color: var(--muted); font-size: 16.5px; margin: 0; max-width: 64ch; }
.saas { border: 1px solid var(--line); border-left: 4px solid var(--mark); background: var(--surface); padding: 12px 15px; border-radius: 0 8px 8px 0; font-size: 14.5px; }
.saas b { font-family: var(--f-display); }
.lesson-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.lesson-list a { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; text-decoration: none; color: var(--ink); border-top: 1px solid var(--line); }
.lesson-list a:first-child { border-top: 0; }
.lesson-list a:hover { background: var(--sunk); }
.lesson-list small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.lesson-list .go { color: var(--muted); font-size: 13px; }
.lesson-head h1 { font-size: clamp(26px, 4vw, 38px); margin-top: 4px; }
.subs { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.subs ul { margin: 4px 0 0; padding-left: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; font-size: 14.5px; }
.prose p { margin: 0 0 12px; max-width: 68ch; }
.prose p:last-child { margin-bottom: 0; }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-h h2 { font-size: 19px; }
.code { background: var(--code-bg); color: var(--code-ink); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--code-line); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--code-line); font: 12px/1 var(--f-mono); color: #8fa19a; }
.code-bar button { background: #22302c; color: #dfe7e3; border: 0; border-radius: 6px; padding: 5px 10px; font-size: 12px; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 13.2px/1.6 var(--f-mono); tab-size: 4; }
.code pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-doctag { color: #7cc7ff; }
.hljs-string, .hljs-attr + .hljs-string, .hljs-regexp { color: #b5e28a; }
.hljs-number, .hljs-literal { color: #f5b971; }
.hljs-comment, .hljs-quote { color: #6f817b; font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-section { color: #f2cf4e; }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-variable, .hljs-params { color: #d6c3ff; }
.hljs-meta, .hljs-tag, .hljs-name { color: #8fd8c8; }
.hljs-type, .hljs-class .hljs-title { color: #ffaf9e; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 18px; }
textarea, .field { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 10px 12px; font: 14px/1.5 var(--f-body); resize: vertical; }
textarea.mono { font-family: var(--f-mono); font-size: 13px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 12.5px; color: var(--muted); }
.quiz-q { font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: baseline; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt b { font: 600 12px/1 var(--f-mono); color: var(--muted); }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.verdict { font-size: 14px; padding: 10px 12px; border-radius: 8px; }
.verdict.ok { background: var(--good-soft); }
.verdict.no { background: var(--bad-soft); }
.tutor-out { font-size: 14.5px; border-top: 1px dashed var(--line); padding-top: 12px; }
.tutor-out:empty { display: none; }
.tutor-out p { margin: 0 0 10px; }
.tutor-out pre { background: var(--code-bg); color: var(--code-ink); padding: 12px; border-radius: 8px; overflow-x: auto; font: 13px/1.55 var(--f-mono); }
.tutor-out pre code { background: none; padding: 0; color: inherit; }
.tutor-out ul, .tutor-out ol { margin: 0 0 10px; padding-left: 22px; }
.chat-turn { display: flex; flex-direction: column; gap: 4px; }
.chat-turn .who { font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chat-log { display: flex; flex-direction: column; gap: 14px; }
.chat-log:empty { display: none; }
.lesson-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.done-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--mark); color: var(--mark-ink); padding: 6px 12px; border-radius: 99px; font-weight: 600; font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }

/* projects */
.proj { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 14px; }
.proj .big { font: 800 34px/1 var(--f-display); color: var(--accent); }
.proj h3 { font-size: 19px; }
.proj p { margin: 4px 0 8px; color: var(--muted); font-size: 14.5px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks label { display: flex; gap: 10px; align-items: baseline; font-size: 14.5px; cursor: pointer; }
.checks input { accent-color: var(--accent); transform: translateY(2px); }
.mods-used { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.mods-used a { font-size: 12px; background: var(--sunk); color: var(--ink); text-decoration: none; padding: 3px 8px; border-radius: 99px; }


.card.track.chosen { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card.track .n { color: var(--accent); }
.roles { font-size: 13px; color: var(--ink); font-weight: 500; }
.chip { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--ink); }
.chip.lvl-beginner { background: var(--good-soft); }
.chip.lvl-intermediate { background: color-mix(in srgb, var(--mark) 35%, var(--surface)); }
.chip.lvl-advanced { background: var(--bad-soft); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps .step-n { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--lvc); display: grid; place-items: center; font: 600 12px/1 var(--f-mono); color: var(--lvc); }
.steps li.full .step-n { background: var(--lvc); color: var(--surface); }
.steps a { text-decoration: none; color: var(--ink); }
.steps small { display: block; color: var(--muted); font-size: 13px; }
.idea { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.idea .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.idea h3 { font-size: 17px; }
.idea p { margin: 0; font-size: 14.5px; }
.idea ul { margin: 2px 0 4px; padding-left: 20px; font-size: 14px; }
.built { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
.built input { accent-color: var(--accent); }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.ideas .idea { background: var(--surface); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 14px; font-weight: 500; }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.site-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; font-size: 13px; color: var(--muted); }
.site-foot a { color: var(--muted); }
.scrim { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .rail { position: fixed; left: 0; top: calc(var(--top) + env(safe-area-inset-top, 0px)); bottom: 0; width: min(330px, 88vw); z-index: 40; transform: translateX(-102%); transition: transform .25s; height: auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  body.drawer .rail { transform: none; }
  body.drawer .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 35; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .path { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .overall .bar { display: none; }
  .sync { display: none; }
}
@media (max-width: 560px) {

<script>
(() => {
  "use strict";
  const COURSE = (window.COURSE || []).slice().sort((a, b) => a.n - b.n);
  const TOPICS = window.TOPICS || {};
  const ROLES = window.ROLES || [];
  const REPO = "https://github.com/Pallak-08/forge-academy";
  const AUTHOR = "Pallak Khullar";
  const LEVELS = {
    1: { name: "Foundations", note: "Languages, tools and problem solving" },
    2: { name: "Web development", note: "APIs, databases and interfaces" },
    3: { name: "Security and systems", note: "Protecting users and running work safely" },
    4: { name: "AI and agents", note: "Building with language models" },

  const modByN = (n) => COURSE.find((x) => x.n === n);
  const lessonRef = (ref) => { const [n, i] = String(ref).split("-").map(Number); const m = modByN(n); return m && m.lessons[i] ? { m, i, l: m.lessons[i], k: n + "-" + i } : null; };
  const roleOf = (id) => ROLES.find((r) => r.id === id);
  const roleTopics = (r) => { const seen = new Set(), out = []; r.stages.forEach((s, si) => s.topics.forEach((id) => { if (!seen.has(id) && TOPICS[id]) { seen.add(id); out.push({ id, si }); } })); return out; };

  /* ---------- state ---------- */
  const LS = "forge-academy-v2";
  const blank = () => ({ done: {}, quiz: {}, notes: {}, answers: {}, topics: {}, subs: {}, labs: {}, tnotes: {}, pj: {}, jr: {}, role: "", last: "", lastTopic: "", updated: 0 });
  let S = blank();
  try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  let remote = null, saveTimer = null;
  function save() {
    S.updated = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}

      setSync("Saving…");

    return out;
  }
  (async () => {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc("data/users/" + id + "/progress-v2");
      const snap = await ref.get();
      if (snap.exists) { S = merge(S, snap.data() || {}); try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

  /* ---------- AI tutor (only inside Claude) ---------- */

      if (i % 2) return `<pre><code>${esc(p.replace(/\n$/, ""))}</code></pre>`;
      return esc(p).split(/\n{2,}/).map((blk) => {
        let b = blk.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
        const lines = b.split("\n");
        if (lines.every((l) => /^\s*[-*] /.test(l) || !l.trim())) return "<ul>" + lines.filter((l) => l.trim()).map((l) => "<li>" + l.replace(/^\s*[-*] /, "") + "</li>").join("") + "</ul>";
        if (lines.every((l) => /^\s*\d+[.)] /.test(l) || !l.trim())) return "<ol>" + lines.filter((l) => l.trim()).map((l) => "<li>" + l.replace(/^\s*\d+[.)] /, "") + "</li>").join("") + "</ol>";
        b = b.replace(/^#{1,4} (.*)$/gm, "<b>$1</b>");

  const plain = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.replace(/\s+/g, " ").trim(); };
  const BASE = `You are a patient, precise tutor inside "Forge Academy", a free platform with complete career roadmaps (notes, hands-on labs, quizzes and projects) for roles such as frontend, backend, full-stack, AI engineering, DevOps, cybersecurity, data analysis, data science and mobile development. Learners are college students and early-career people. Teach clearly and concretely: short paragraphs, small runnable examples in fenced code blocks, plain language, no hype.`;
  function lessonContext(m, l) {
    return `${BASE}
Lesson: ${l.t} (module ${m.n}: ${m.title}).
Sub-topics: ${l.sub.join("; ")}.
Lesson text: ${plain(l.body)}
Code example (${l.lang}):
${l.code}`;
  }
  function topicContext(r, t) {
    return `${BASE}
Role: ${r ? r.title : "general"}. Topic: ${t.t}. ${t.d}

      const lHits = [];

  try { const t = localStorage.getItem("forge-academy-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

  /* ---------- shared pieces ---------- */
  function footer() {
    return `<footer class="site-foot"><span>Forge Academy is a free, open learning platform created by ${esc(AUTHOR)}.</span><span><a href="${REPO}" target="_blank" rel="noopener">Source on GitHub</a> · <a href="#about">About</a></span></footer>`;

  /* ---------- views ---------- */
  function viewHome() {
    const r = roleOf(S.role);
    const nx = r ? nextTopic(r) : null;
    const topicsDone = Object.values(S.topics).filter(Boolean).length;
    const built = Object.values(S.pj).filter(Boolean).length;
    const labsDone = Object.values(S.labs).filter(Boolean).length;
    return `<div class="wrap wide">
      <section class="hero">
        <div>
          <span class="eyebrow">Free and open · ${ROLES.length} career roadmaps · ${Object.keys(TOPICS).length} topics · ${COURSE.reduce((s, m) => s + m.lessons.length, 0)} full lessons</span>
          <h1 style="margin-top:10px">Find your path in tech. <em>Then walk it.</em></h1>
          <p>One place with the complete roadmap for the role you want, and everything to learn it: notes, worked code, hands-on labs, quizzes, small projects, big projects and a final capstone. No more stitching together ten half-finished courses.</p>
          <div class="row-btns" style="margin-top:16px"><a class="btn btn-primary" href="#roles">${r ? "See all roles" : "Choose a role"}</a><a class="btn btn-line" href="#about">How it works</a></div>
        </div>
        <div class="continue">
          ${r && nx ? `<span class="eyebrow">Continue · ${esc(r.title)} · Stage ${nx.si + 1}</span>
            <h3>${esc(TOPICS[nx.id].t)}</h3><span class="meta">${esc(r.stages[nx.si].t)}: ${esc(r.stages[nx.si].goal)}</span>
            <div><a class="btn btn-primary" href="#x-${r.id}.${nx.id}">Continue</a></div>`
          : r ? `<span class="eyebrow">${esc(r.title)}</span><h3>Every topic is done.</h3><span class="meta">Finish the big project and capstone, then the job-ready checklist.</span><div><a class="btn btn-primary" href="#r-${r.id}">Open roadmap</a></div>`
          : `<span class="eyebrow">Start here</span><h3>Not sure which role fits?</h3><span class="meta">Read the one-line description of each role below and pick the one that sounds like you. You can switch any time and keep your progress.</span><div><a class="btn btn-primary" href="#roles">Compare roles</a></div>`}
        </div>
      </section>
      <section class="stats" aria-label="Your progress">
        <div class="stat"><b>${topicsDone}</b><span>topics completed</span></div>
        <div class="stat"><b>${lessonsDone()}</b><span>lessons finished</span></div>
        <div class="stat"><b>${labsDone}</b><span>lab steps done</span></div>
        <div class="stat"><b>${built}</b><span>projects built</span></div>
      </section>
      <section class="level-block">
        <div class="level-title" style="--lvc: var(--accent)"><h2>Career roadmaps</h2><span>Each role has its own stages, topics, labs and projects</span></div>
        <div class="cards">${ROLES.map(roleCard).join("")}</div>
      </section>
      <section class="level-block">
        <div class="level-title" style="--lvc: var(--mark)"><h2>How every roadmap works</h2><span>The same rhythm for every role</span></div>
        <div class="how">
          <div><b>1. Pick a role</b><p>See the full map: stages, topics, projects and the job-ready checklist.</p></div>
          <div><b>2. Learn each topic</b><p>Sub-topics to cover, full lessons with notes, code and quizzes where available.</p></div>
          <div><b>3. Do the lab</b><p>A hands-on task with steps and a clear "done when" for every topic.</p></div>
          <div><b>4. Build and show</b><p>A mini project per stage, then a big project and a capstone for your portfolio.</p></div>
        </div>
      </section>
      ${footer()}
    </div>`;
  }

  function viewRoles() {
    return `<div class="wrap wide">
      <nav class="crumbs"><a href="#home">Home</a><span>›</span><span>All roles</span></nav>
      <header class="mod-head"><span class="eyebrow">Choose a direction</span><h1>Career roadmaps</h1><p class="lede">Each roadmap is built for one role, in the order you should learn things, with a project at the end of every stage. Topics shared between roles (like Git or SQL) count once, so switching roles never wastes your progress.</p></header>
      <div class="cards">${ROLES.map(roleCard).join("")}</div>
      ${footer()}
    </div>`;
  }

  function viewRole(r) {
    const d = roleDone(r), tot = roleTopics(r).length;
    const jrDone = r.jobReady.filter((_, j) => S.jr[`${r.id}-${j}`]).length;
    return `<div class="wrap">
      <nav class="crumbs"><a href="#home">Home</a><span>›</span><a href="#roles">All roles</a><span>›</span><span>${esc(r.title)}</span></nav>
      <header class="mod-head role-head">
        <div class="row-btns"><span class="glyph lg">${esc(r.glyph)}</span><span class="eyebrow">${esc(r.duration)}</span></div>
        <h1>${esc(r.title)}</h1><p class="lede">${esc(r.tagline)} ${esc(r.who)}</p>
        <p class="roles" style="margin:0">Job titles: ${r.jobs.map(esc).join(" · ")}</p>
        <div class="row-btns">${S.role === r.id ? '<span class="done-pill">This is your path</span>' : '<button class="btn btn-primary" type="button" id="pickRole">Make this my path</button>'}
          <span class="note">${d} of ${tot} topics done · full lessons for ${roleCoverage(r)}% of topics, labs for all</span></div>
        <div class="mini big"><i style="width:${tot ? Math.round((d / tot) * 100) : 0}%"></i></div>
      </header>
      <section class="roadmap">${r.stages.map((s, si) => {
        const ids = s.topics.filter((id) => TOPICS[id]);
        const sd = ids.filter((id) => S.topics[id]).length;
        return `<div class="stage ${sd === ids.length ? "complete" : ""}">
          <div class="stage-rail"><span class="stage-n">${si + 1}</span></div>
          <div class="stage-body">
            <div class="section-h"><div><span class="eyebrow">Stage ${si + 1} · ${sd}/${ids.length} topics</span><h2>${esc(s.t)}</h2></div></div>
            <p class="note" style="margin:0">${esc(s.goal)}</p>
            <div class="nodes">${ids.map((id) => { const t = TOPICS[id], st = topicState(id);
              return `<a class="node ${st}" href="#x-${r.id}.${id}"><span class="tick" data-tstate="${id}"></span><span class="node-t">${esc(t.t)}</span><span class="node-tags">${t.les.length ? `<span>${t.les.length} lesson${t.les.length > 1 ? "s" : ""}</span>` : "<span>guide</span>"}<span>lab</span></span></a>`; }).join("")}</div>
            ${projCard(`${r.id}-s${si}`, "Mini project", s.mini, "stage-proj")}
          </div></div>`;
      }).join("")}</section>
      <section class="panel"><h2>Big project</h2>${projCard(`${r.id}-big`, "Big project", r.big)}</section>
      <section class="panel"><h2>Final capstone</h2>${projCard(`${r.id}-cap`, "Capstone", r.capstone)}</section>
      <section class="panel"><div class="section-h"><h2>Job-ready checklist</h2><span class="note">${jrDone} of ${r.jobReady.length}</span></div>
        <p class="hint" style="margin:0">Tick each item when you can do it without notes and can point to a project that shows it.</p>
        <ul class="checks">${r.jobReady.map((c, j) => { const id = `${r.id}-${j}`; return `<li><label><input type="checkbox" data-jr="${id}" ${S.jr[id] ? "checked" : ""}><span>${esc(c)}</span></label></li>`; }).join("")}</ul>
      </section>
      <section class="panel"><h2>Common interview questions</h2>
        <ol class="iq">${r.interview.map((q, j) => `<li><span>${esc(q)}</span><button class="btn btn-quiet sm" type="button" data-tutor hidden data-iq="${j}">Practise with the tutor</button></li>`).join("")}</ol>
        <div class="tutor-out" id="iqOut"></div>
      </section>
      ${footer()}
    </div>`;
  }

  function viewTopic(r, id) {
    const t = TOPICS[id];
    const order = r ? roleTopics(r) : [];
    const pos = order.findIndex((x) => x.id === id);
    const stage = r && pos >= 0 ? r.stages[order[pos].si] : null;
    const prev = pos > 0 ? `#x-${r.id}.${order[pos - 1].id}` : "";
    const next = pos >= 0 && pos < order.length - 1 ? `#x-${r.id}.${order[pos + 1].id}` : (r ? `#r-${r.id}` : "");
    const lessons = t.les.map(lessonRef).filter(Boolean);
    const subDone = t.sub.filter((_, i) => S.subs[id + "-" + i]).length;
    const labDone = t.lab.steps.filter((_, i) => S.labs[id + "-" + i]).length;
    const also = rolesWith(id).filter((x) => !r || x !== r.id).map(roleOf);
    const tutor = chatBox(() => topicContext(r, t), {
      teach: ["Teach me this topic", "Teach this topic from scratch as structured notes: a short intro, one section per sub-topic with a small example, common mistakes, and a 5-question self-check at the end."],
      lab: ["Help me start the lab", "I'm starting the hands-on lab for this topic. Break the first two steps into smaller actions, list what I need installed, and tell me what success looks like for each step. Do not do the whole lab for me."],
      why: ["Why does this matter for the job?", "Explain why this topic matters in day-to-day work for this role, with two concrete workplace examples and what interviewers typically ask about it."]
    });
    return { html: `<div class="wrap" style="--lvc: var(--accent)">
      <nav class="crumbs"><a href="#home">Home</a><span>›</span>${r ? `<a href="#r-${r.id}">${esc(r.title)}</a><span>›</span><span>Stage ${order[pos].si + 1}: ${esc(stage.t)}</span>` : "<span>Topic</span>"}</nav>
      <header class="lesson-head"><span class="tag">${r ? `Topic ${pos + 1} of ${order.length}` : "Topic"}</span><h1>${esc(t.t)}</h1><p class="lede" style="margin-top:8px">${esc(t.d)}</p></header>
      <section class="panel"><div class="section-h"><h2>What to learn</h2><span class="note">${subDone} of ${t.sub.length}</span></div>
        <ul class="checks">${t.sub.map((s, i) => `<li><label><input type="checkbox" data-sub="${id}-${i}" ${S.subs[id + "-" + i] ? "checked" : ""}><span>${esc(s)}</span></label></li>`).join("")}</ul></section>
      <section class="panel"><div class="section-h"><h2>Lessons</h2>${lessons.length ? `<span class="note">${lessons.filter((x) => S.done[x.k]).length} of ${lessons.length} done</span>` : ""}</div>
        ${lessons.length ? `<div class="lesson-list">${lessons.map((x) => `<a href="#l-${x.m.n}-${x.i}"><span class="tick ${S.done[x.k] ? "done" : ""}"></span><span><b>${esc(x.l.t)}</b><small>Notes · code example · exercise · quiz</small></span><span class="go">Open ›</span></a>`).join("")}</div>`
        : `<p style="margin:0">Full lessons for this topic are coming in a later update. Until then, use the checklist above as your study guide, learn each item from the official documentation for the tool, and prove it with the lab below.</p><p class="hint" data-tutor hidden style="margin:0">Use "Teach me this topic" below to get structured notes from the tutor now.</p>`}
      </section>
      <section class="panel lab"><div class="section-h"><h2>Hands-on lab: ${esc(t.lab.t)}</h2><span class="note">${labDone} of ${t.lab.steps.length} steps</span></div>
        <ol class="checks steps-list">${t.lab.steps.map((s, i) => `<li><label><input type="checkbox" data-lab="${id}-${i}" ${S.labs[id + "-" + i] ? "checked" : ""}><span>${esc(s)}</span></label></li>`).join("")}</ol>
        <p class="done-when"><b>Done when:</b> ${esc(t.lab.done)}</p>
        <textarea id="tnoteBox" rows="3" placeholder="Lab notes: commands you ran, links to your repo, what you learned">${esc(S.tnotes[id] || "")}</textarea>
      </section>
      ${tutor.html}
      ${also.length ? `<p class="note">Also part of: ${also.map((x) => `<a href="#x-${x.id}.${id}">${esc(x.title)}</a>`).join(", ")}. Your progress counts in every roadmap.</p>` : ""}
      <footer class="lesson-foot">
        <div class="row-btns">${prev ? `<a class="btn btn-line" href="${prev}">‹ Previous topic</a>` : ""}</div>
        <div class="row-btns">${S.topics[id] ? `<span class="done-pill">Topic complete</span><button class="btn btn-line" type="button" id="undoTopic">Mark as not done</button>${next ? `<a class="btn btn-primary" href="${next}">${pos < order.length - 1 ? "Next topic ›" : "Back to roadmap"}</a>` : ""}` : `<button class="btn btn-primary" type="button" id="doneTopic">Mark topic complete${next ? " and continue" : ""}</button>`}</div>
      </footer>
      ${footer()}
    </div>`, bind() {
      tutor.bind();
      let typing;
      $("#tnoteBox").addEventListener("input", (e) => { S.tnotes[id] = e.target.value; clearTimeout(typing); typing = setTimeout(save, 600); });
      const dt = $("#doneTopic"); if (dt) dt.addEventListener("click", () => { S.topics[id] = 1; save(); if (next) location.hash = next; else render(); });
      const ut = $("#undoTopic"); if (ut) ut.addEventListener("click", () => { delete S.topics[id]; save(); render(); });
    } };
  }

  function viewLibrary() {
    let html = `<div class="wrap wide"><nav class="crumbs"><a href="#home">Home</a><span>›</span><span>Lesson library</span></nav>
      <header class="mod-head"><span class="eyebrow">Every full lesson in one place</span><h1>Lesson library</h1><p class="lede">${COURSE.length} modules and ${COURSE.reduce((s, m) => s + m.lessons.length, 0)} lessons. Each lesson has notes, a code example, an exercise and a quiz. Roadmap topics link to the lessons they need, so most people reach these from their roadmap.</p></header>`;
    for (const lv of [1, 2, 3, 4, 5]) {
      const mods = COURSE.filter((m) => m.level === lv);
      if (!mods.length) continue;
      html += `<section class="level-block" style="${lvc(lv)}"><div class="level-title"><h2>Level ${lv} · ${LEVELS[lv].name}</h2><span>${LEVELS[lv].note}</span></div>
        <div class="cards">${mods.map((m) => { const md_ = modDone(m); return `<a class="card" href="#m-${m.n}" style="${lvc(lv)}"><div class="row"><span class="n">MODULE ${String(m.n).padStart(2, "0")}</span><span class="note">${md_}/${m.lessons.length}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.blurb)}</p><div class="mini"><i style="width:${Math.round((md_ / m.lessons.length) * 100)}%"></i></div></a>`; }).join("")}</div></section>`;
    }
    return html + footer() + "</div>";
  }

  function viewModule(m) {
    const usedBy = Object.entries(TOPICS).filter(([, t]) => t.les.some((r) => r.startsWith(m.n + "-"))).map(([id]) => id);
    const roles = [...new Set(usedBy.flatMap(rolesWith))].map(roleOf).filter(Boolean);
    return `<div class="wrap" style="${lvc(m.level)}">
      <nav class="crumbs"><a href="#home">Home</a><span>›</span><a href="#library">Lesson library</a><span>›</span><span>Module ${m.n}</span></nav>
      <header class="mod-head"><span class="tag">Level ${m.level} · ${LEVELS[m.level].name}</span><h1>${esc(m.title)}</h1><p class="lede">${esc(m.blurb)}</p></header>
      ${roles.length ? `<p class="note" style="margin:0">Used in: ${roles.map((r) => `<a href="#r-${r.id}">${esc(r.title)}</a>`).join(", ")}</p>` : ""}
      <div class="saas"><b>Real-world example: SaaSForge.</b> ${m.saas}</div>
      <div class="section-h"><h2>Lessons</h2><span class="note">${modDone(m)} of ${m.lessons.length} done</span></div>
      <div class="lesson-list">${m.lessons.map((l, i) => `<a href="#l-${m.n}-${i}"><span class="tick ${S.done[key(m, i)] ? "done" : ""}"></span><span><b>${i + 1}. ${esc(l.t)}</b><small>${esc(l.sub.join(" · "))}</small></span><span class="go">Open ›</span></a>`).join("")}</div>
      ${footer()}
    </div>`;
  }

  function lessonBackLink(k) {
    const parts = String(S.lastTopic).split("|");
    if (parts.length === 2 && TOPICS[parts[1]] && TOPICS[parts[1]].les.includes(k)) return { href: `#x-${parts[0]}.${parts[1]}`, label: TOPICS[parts[1]].t };
    return null;
  }

  function viewLesson(m, i) {
    const l = m.lessons[i], k = key(m, i);
    const back = lessonBackLink(k);
    const prev = i > 0 ? `#l-${m.n}-${i - 1}` : "";
    const next = back ? (() => { const t = TOPICS[S.lastTopic.split("|")[1]]; const j = t.les.indexOf(k); return j < t.les.length - 1 ? "#l-" + t.les[j + 1] : back.href; })() : (i < m.lessons.length - 1 ? `#l-${m.n}-${i + 1}` : `#m-${m.n}`);
    const chosen = S.quiz[k];
    const tutor = chatBox(() => lessonContext(m, l), {
      simpler: ["Explain it more simply", "Explain this lesson again as if I am a beginner, using an everyday analogy, then restate the key idea in two sentences."],
      walk: ["Walk through the code", "Walk through the lesson's code example line by line. For each important line, say what it does and why it is written that way."],
      example: ["Show another example", "Give me a different, small, runnable example of the same idea in a new domain, with a short explanation."],
      real: ["How is this used at work?", "How is this lesson's idea used in real production software? Give two or three concrete situations and one common mistake people make."]
    });
    return { html: `<div class="wrap" style="${lvc(m.level)}">
      <nav class="crumbs"><a href="#home">Home</a><span>›</span>${back ? `<a href="${back.href}">Topic: ${esc(back.label)}</a>` : `<a href="#m-${m.n}">Module ${m.n}: ${esc(m.title)}</a>`}<span>›</span><span>Lesson</span></nav>
      <header class="lesson-head"><span class="tag">Level ${m.level} · ${LEVELS[m.level].name}</span><h1>${esc(l.t)}</h1></header>
      <section class="subs"><span class="eyebrow">Sub-topics in this lesson</span><ul>${l.sub.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></section>
      <section class="prose"><span class="eyebrow">Notes</span>${l.body}</section>
      <section class="code"><div class="code-bar"><span>${esc(l.lang)}</span><button type="button" id="copyBtn">Copy code</button></div><pre><code id="codeEl"></code></pre></section>
      ${tutor.html}
      <section class="panel">
        <div class="section-h"><h2>Exercise</h2></div>
        <div class="prose"><p>${l.ex}</p></div>
        <textarea class="mono" id="answerBox" rows="7" placeholder="Write or paste your solution here. It is saved as you type.">${esc(S.answers[k] || "")}</textarea>
        <div class="row-btns" data-tutor hidden>
          <button class="btn btn-primary" type="button" id="reviewBtn">Review my answer</button>
          <button class="btn btn-quiet" type="button" id="hintBtn">Give me a hint</button>
          <button class="btn btn-quiet" type="button" id="moreBtn">Another exercise</button>
        </div>
        <p class="hint" data-tutor-off>Run your solution, then compare it with the lesson's example. Stuck? Re-read the sub-topics and try a smaller version first.</p>
        <div class="tutor-out" id="exOut"></div>
      </section>
      <section class="panel">
        <div class="section-h"><h2>Quiz</h2>${chosen !== undefined ? '<button class="btn btn-line" type="button" id="retryQuiz">Try again</button>' : ""}</div>
        <p class="quiz-q" style="margin:0">${l.q[0]}</p>
        <div class="opts">${l.q[1].map((o, j) => { const cls = chosen === undefined ? "" : j === l.q[2] ? "right" : j === chosen ? "wrong" : ""; return `<button type="button" class="opt ${cls}" data-opt="${j}" ${chosen !== undefined ? "disabled" : ""}><b>${"ABCD"[j]}</b><span>${o}</span></button>`; }).join("")}</div>
        ${chosen !== undefined ? `<div class="verdict ${chosen === l.q[2] ? "ok" : "no"}"><b>${chosen === l.q[2] ? "Correct." : "Not quite."}</b> ${esc(l.q[3])}</div>` : ""}
        <div class="row-btns" data-tutor hidden><button class="btn btn-quiet" type="button" id="moreQuiz">Quiz me with 3 more questions</button></div>
        <div class="tutor-out" id="quizOut"></div>
      </section>
      <section class="panel">
        <div class="section-h"><h2>My notes</h2><span class="hint">Saved as you type</span></div>
        <textarea id="noteBox" rows="4" placeholder="What clicked, what to revisit, questions for later">${esc(S.notes[k] || "")}</textarea>
      </section>
      <footer class="lesson-foot">
        <div class="row-btns">${prev ? `<a class="btn btn-line" href="${prev}">‹ Previous</a>` : ""}</div>
        <div class="row-btns">${S.done[k] ? `<span class="done-pill">Completed</span><button class="btn btn-line" type="button" id="undoBtn">Mark as not done</button><a class="btn btn-primary" href="${next}">${back && next === back.href ? "Back to topic ›" : "Next ›"}</a>` : `<button class="btn btn-primary" type="button" id="doneBtn">Mark complete and continue</button>`}</div>
      </footer>
    </div>`, bind() {
      const codeEl = $("#codeEl");
      codeEl.textContent = l.code;
      const lang = LANG[l.lang] || "plaintext";
      if (window.hljs && lang !== "plaintext" && hljs.getLanguage(lang)) { codeEl.className = "language-" + lang; try { hljs.highlightElement(codeEl); } catch (e) {} }
      $("#copyBtn").addEventListener("click", async (e) => {
        try { await navigator.clipboard.writeText(l.code); e.target.textContent = "Copied"; }
        catch (err) { const rg = document.createRange(); rg.selectNodeContents(codeEl); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); e.target.textContent = "Selected, press Ctrl+C"; }
        setTimeout(() => (e.target.textContent = "Copy code"), 1800);
      });
      let typing;
      $("#answerBox").addEventListener("input", (e) => { S.answers[k] = e.target.value; clearTimeout(typing); typing = setTimeout(save, 600); });
      $("#noteBox").addEventListener("input", (e) => { S.notes[k] = e.target.value; clearTimeout(typing); typing = setTimeout(save, 600); });
      document.querySelectorAll("[data-opt]").forEach((b) => b.addEventListener("click", () => { S.quiz[k] = +b.dataset.opt; save(); keepScroll(); }));
      const rq = $("#retryQuiz"); if (rq) rq.addEventListener("click", () => { delete S.quiz[k]; save(); keepScroll(); });
      const d = $("#doneBtn"); if (d) d.addEventListener("click", () => { S.done[k] = 1; save(); location.hash = next; });
      const u = $("#undoBtn"); if (u) u.addEventListener("click", () => { delete S.done[k]; save(); keepScroll(); });
      const extra = () => Array.from(document.querySelectorAll("#reviewBtn, #hintBtn, #moreBtn, #moreQuiz"));
      tutor.bind(extra);
      if (!sample) return;
      const ctx = lessonContext(m, l);
      const all = () => Array.from(document.querySelectorAll("#askBtn, [data-quick]")).concat(extra());
      $("#reviewBtn").addEventListener("click", () => {
        const a = $("#answerBox").value.trim();
        if (!a) { $("#exOut").innerHTML = '<p class="note">Write your answer in the box first, then ask for a review.</p>'; return; }
        ask($("#exOut"), `${ctx}\n\nExercise: ${plain(l.ex)}\n\nThe learner's answer:\n${a.slice(0, 12000)}\n\nReview it like a kind senior engineer: say what is correct, list any bugs or misunderstandings with the fix, mention one improvement, and end with a verdict: "Ready to move on" or "Revise and resubmit". Do not rewrite the whole solution unless it is badly wrong.`, all(), { cache: false });
      });
      $("#hintBtn").addEventListener("click", () => ask($("#exOut"), `${ctx}\n\nExercise: ${plain(l.ex)}\n\nGive one helpful hint without giving away the solution. Two to four sentences.`, all()));
      $("#moreBtn").addEventListener("click", () => ask($("#exOut"), `${ctx}\n\nWrite one new practice exercise for this lesson that is slightly harder than: "${plain(l.ex)}". Give the task, an example input and output, and two hints. No solution.`, all(), { cache: false }));
      $("#moreQuiz").addEventListener("click", () => ask($("#quizOut"), `${ctx}\n\nWrite 3 new multiple-choice questions about this lesson, each with options A-D. After all three, list the answers with one-sentence explanations under a heading "Answers".`, all(), { cache: false }));
    } };
  }

  let projRole = "";
  function viewProjects() {
    const r = roleOf(projRole) || roleOf(S.role) || ROLES[0];
    projRole = r.id;
    const total = ROLES.reduce((s, x) => s + x.stages.length + 2, 0);
    return `<div class="wrap wide">
      <nav class="crumbs"><a href="#home">Home</a><span>›</span><span>Projects</span></nav>
      <header class="mod-head"><span class="eyebrow">${total} projects across ${ROLES.length} roles</span><h1>Projects</h1><p class="lede">Projects are what get you interviews. Every role has a mini project after each stage, one big project and a final capstone. Push each one to GitHub with a README, screenshots and a live link.</p></header>
      <div class="tabs" role="tablist">${ROLES.map((x) => `<button type="button" role="tab" class="tab ${x.id === r.id ? "on" : ""}" data-prole="${x.id}">${esc(x.title)}</button>`).join("")}</div>
      <div class="ideas">${r.stages.map((s, si) => projCard(`${r.id}-s${si}`, "Mini project", s.mini)).join("")}${projCard(`${r.id}-big`, "Big project", r.big)}${projCard(`${r.id}-cap`, "Capstone", r.capstone)}</div>
      <p class="note">See where each project fits on the <a href="#r-${r.id}">${esc(r.title)} roadmap</a>.</p>
      ${footer()}
    </div>`;
  }

  function viewAbout() {
    return `<div class="wrap">
      <nav class="crumbs"><a href="#home">Home</a><span>›</span><span>About</span></nav>
      <header class="mod-head"><span class="eyebrow">About Forge Academy</span><h1>One place for the whole path</h1>
        <p class="lede">Forge Academy was created by ${esc(AUTHOR)} to fix a problem every student runs into: too many sources, none complete, and no clear route from where you are to the job you want.</p></header>
      <section class="panel prose"><h2>What makes it different</h2>
        <p>Roadmap sites show you <i>what</i> to learn. Video courses teach <i>some</i> of it. Forge Academy puts the complete roadmap for each role together with the material to learn it: notes, worked code, hands-on labs with clear finish lines, quizzes, and projects at every stage, ending in a capstone you can show employers.</p></section>
      <section class="panel prose"><h2>Who it is for</h2>
        <p>College and university students who want a plan alongside their degree, people in their first job who want to grow or switch roles, and anyone changing careers into tech. Level 1 topics assume no experience.</p></section>
      <section class="panel prose"><h2>How to use it</h2>
        <p><b>1. Pick a role.</b> Read the descriptions and choose the one that sounds like you. You can switch later; shared topics keep their progress.</p>
        <p><b>2. Go stage by stage.</b> For each topic, tick off the sub-topics as you learn them, open the full lessons where available, and finish the lab.</p>
        <p><b>3. Build the stage project</b> before moving on. Put it on GitHub with a README and a live link.</p>
        <p><b>4. Finish with the big project and capstone</b>, then work through the job-ready checklist and practise the interview questions.</p>
        <p><b>5. Share your journey</b> on LinkedIn. Explaining what you built is part of getting hired.</p></section>
      <section class="panel prose"><h2>What's ready now</h2>
        <p>All ${ROLES.length} roadmaps are complete: every stage, topic, lab and project. Full lessons (notes, code, exercise and quiz) are being added in waves. Backend and AI Engineer have full lessons for every technical topic today; other roles have full lessons for shared topics, with more on the way. Topics without a lesson yet still have a study checklist and a lab.</p></section>
      <section class="panel prose"><h2>The running example: SaaSForge</h2>
        <p>Many lessons point to <b>SaaSForge</b>, an open-source AI agent that turns a plain-English brief or an existing HTML tool into a tested, deployed web app. It uses most of the backend, AI and DevOps topics here, so it shows how the pieces fit together in a real system.</p></section>
      <section class="panel prose"><h2>Your progress and privacy</h2>
        <p>There are no accounts. Everything you tick, write and complete is saved in your own browser on this device. Clearing site data resets it.</p></section>
      <section class="panel prose"><h2>Contribute</h2>
        <p>Spotted a mistake, or want to add a lesson, lab or role? All content lives in plain JavaScript files in the <a href="${REPO}" target="_blank" rel="noopener">GitHub repository</a>. Open an issue or a pull request.</p></section>
      ${footer()}
    </div>`;
  }

  /* ---------- router ---------- */
  function keepScroll() { const y = scrollY; render(); scrollTo(0, y); }
  function render() {
    const h = location.hash || "#home";
    const main = $("#main");
    let mm, m, view = null;
    if ((mm = h.match(/^#l-(\d+)-(\d+)$/)) && (m = modByN(+mm[1])) && m.lessons[+mm[2]]) {
      view = viewLesson(m, +mm[2]);
      if (S.last !== key(m, +mm[2])) { S.last = key(m, +mm[2]); save(); }
    } else if ((mm = h.match(/^#x-([a-z-]+)\.([a-z0-9-]+)$/)) && TOPICS[mm[2]]) {
      const r = roleOf(mm[1]);
      view = viewTopic(r && r.stages.some((s) => s.topics.includes(mm[2])) ? r : null, mm[2]);
      const lt = (r ? r.id : "none") + "|" + mm[2];
      if (S.lastTopic !== lt) { S.lastTopic = lt; save(); }
    } else if ((mm = h.match(/^#r-([a-z-]+)$/)) && roleOf(mm[1])) {
      const r = roleOf(mm[1]);
      main.innerHTML = viewRole(r);
      const pk = $("#pickRole"); if (pk) pk.addEventListener("click", () => { S.role = r.id; save(); renderTree($("#search").value); render(); });
      main.querySelectorAll("[data-iq]").forEach((b) => b.addEventListener("click", () => {
        if (!sample) return;
        ask($("#iqOut"), `${BASE}\n\nRole: ${r.title}. Help me practise this interview question: "${r.interview[+b.dataset.iq]}". First give the key points a strong answer should cover, then a model answer in about 150 words, then two follow-up questions an interviewer might ask.`, Array.from(main.querySelectorAll("[data-iq]")));
        $("#iqOut").scrollIntoView({ behavior: "smooth", block: "nearest" });
      }));
    } else if ((mm = h.match(/^#m-(\d+)$/)) && (m = modByN(+mm[1]))) {
      main.innerHTML = viewModule(m);
    } else if (h === "#roles") { main.innerHTML = viewRoles();
    } else if (h === "#projects") {
      main.innerHTML = viewProjects();
      main.querySelectorAll("[data-prole]").forEach((b) => b.addEventListener("click", () => { projRole = b.dataset.prole; render(); }));
    } else if (h === "#library") { main.innerHTML = viewLibrary();
    } else if (h === "#about") { main.innerHTML = viewAbout();
    } else { main.innerHTML = viewHome(); }
    if (view) { main.innerHTML = view.html; view.bind(); }
    main.querySelectorAll("[data-sub]").forEach((c) => c.addEventListener("change", () => { S.subs[c.dataset.sub] = c.checked ? 1 : 0; save(); keepScroll(); }));
    main.querySelectorAll("[data-lab]").forEach((c) => c.addEventListener("change", () => { S.labs[c.dataset.lab] = c.checked ? 1 : 0; save(); keepScroll(); }));
    main.querySelectorAll("[data-jr]").forEach((c) => c.addEventListener("change", () => { S.jr[c.dataset.jr] = c.checked ? 1 : 0; save(); keepScroll(); }));
    main.querySelectorAll("[data-pj]").forEach((c) => c.addEventListener("change", () => { S.pj[c.dataset.pj] = c.checked ? 1 : 0; save(); }));
    showTutor(); paintProgress(); markActive();
  }
  let lastHash = null;
  function route() { render(); if (location.hash !== lastHash) { window.scrollTo(0, 0); lastHash = location.hash; } }
  window.addEventListener("hashchange", route);

  if (!ROLES.length || !COURSE.length) { $("#main").innerHTML = '<div class="wrap"><p class="note">The course content did not load. Reload the page.</p></div>'; return; }
  renderTree();
  route();
})();

</script>

</body>
</html>
