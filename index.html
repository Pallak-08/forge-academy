<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge Labs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#f6f1e9; --surface:#fffdf9; --fg:#201c15; --muted:#716a5c; --line:#e7ddcd; --line2:#f0e9db;
    --accent:#d4831a; --accent-ink:#5a3408; --good:#1b9c6b; --good-soft:#e4f5ec; --bad:#c6482f; --bad-soft:#fbe9e4;
    --editor-bg:#1c1a17; --editor-fg:#f4ede0; --editor-line:#2e2a24;
    --disp:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;
    --body:"IBM Plex Sans",-apple-system,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#15130f; --surface:#1e1b16; --fg:#f2ece0; --muted:#a79e8d; --line:#2f2a22; --line2:#262218;
    --accent:#f0a93e; --accent-ink:#1c1304; --good:#45c492; --good-soft:#132a22; --bad:#f08763; --bad-soft:#2b1812;
    --editor-bg:#121010; --editor-fg:#f1eadd; --editor-line:#262220; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#15130f; --surface:#1e1b16; --fg:#f2ece0; --muted:#a79e8d; --line:#2f2a22; --line2:#262218;
    --accent:#f0a93e; --accent-ink:#1c1304; --good:#45c492; --good-soft:#132a22; --bad:#f08763; --bad-soft:#2b1812;
    --editor-bg:#121010; --editor-fg:#f1eadd; --editor-line:#262220; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.015em}
  button{font-family:var(--body);cursor:pointer}
  img{max-width:100%}
  [hidden]{display:none!important}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:21}
  .head-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left}
  .mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent);display:grid;place-items:center}
  .mark svg{width:20px;height:20px}
  .brand b{font-family:var(--disp);font-weight:800;font-size:1.02rem;letter-spacing:-.02em;white-space:nowrap}
  .brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
  .hspace{margin-left:auto}
  .theme-btn{background:none;border:1px solid var(--line);border-radius:9px;width:36px;height:36px;color:var(--muted);display:grid;place-items:center}
  .theme-btn svg{width:17px;height:17px}

  main{max-width:1180px;margin:0 auto;padding-block:22px 48px}

  /* ---------- gallery ---------- */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:26px}
  .hero .eyebrow{color:var(--accent);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  .hero h1{font-size:2rem;margin:8px 0 0;max-width:20ch}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero p{color:var(--muted);margin:10px 0 0;max-width:60ch;font-size:1rem}
  .hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .hchip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:.82rem;color:var(--muted)}
  .hchip b{color:var(--fg)}

  .track{margin-bottom:30px}
  .track-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
  .track-h h2{font-size:1.25rem}
  .track-h span{color:var(--muted);font-size:.85rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px}
  .labcard{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;text-align:left;color:inherit;transition:transform .12s,border-color .2s,box-shadow .2s}
  .labcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 24px -14px rgba(0,0,0,.3)}
  .labcard .thumb{height:92px;display:grid;place-items:center;font-size:2.5rem;position:relative}
  .labcard .thumb .lvl{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.28);color:#fff;border-radius:99px;padding:3px 10px;font-size:.68rem;font-weight:600;letter-spacing:.03em}
  .labcard .b{padding:14px 15px 16px}
  .labcard h3{font-size:1.05rem}
  .labcard p{color:var(--muted);font-size:.86rem;margin:6px 0 0}
  .labcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .tag{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:.72rem;color:var(--muted)}
  .tag.api{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
  .labcard .status{margin-left:auto;font-size:.74rem;font-weight:600;color:var(--good)}
  .labcard.soon{opacity:.72;cursor:default}
  .labcard.soon:hover{transform:none;border-color:var(--line);box-shadow:none}
  .labcard.custom .thumb{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--good)))}

  /* ---------- lab view ---------- */
  .crumbs{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:16px}
  .crumbs button{background:none;border:0;color:var(--accent);font-size:.85rem;padding:0;cursor:pointer}
  .work{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:18px;align-items:start}
  @media (max-width:880px){.work{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
  .panel .eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .panel h1{font-size:1.45rem;margin-top:4px}
  .panel .lede{color:var(--muted);font-size:.94rem;margin:9px 0 0}
  .goals{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
  .goal{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);transition:.3s}
  .goal .tick{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:.3s}
  .goal .tick svg{width:12px;height:12px;opacity:0;transition:opacity .3s}
  .goal.done{border-color:var(--good);background:var(--good-soft)}
  .goal.done .tick{background:var(--good);border-color:var(--good)}
  .goal.done .tick svg{opacity:1}
  .goal b{display:block;font-size:.92rem}
  .goal small{color:var(--muted);font-size:.82rem}
  .verdict{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:.9rem}
  .verdict.ok{background:var(--good-soft);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
  .verdict.no{background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
  .verdict ul{margin:6px 0 0;padding-left:18px}.verdict code{font-family:var(--mono);font-size:.82em;background:color-mix(in srgb,var(--fg) 8%,transparent);padding:1px 5px;border-radius:5px}
  .win{margin-top:14px;border-radius:12px;padding:16px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--good)));color:var(--accent-ink)}
  .win h3{font-size:1.15rem}.win p{margin:6px 0 0;font-size:.9rem;opacity:.92}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:7px;transition:transform .08s,filter .15s}
  .btn:active{transform:translateY(1px)} .btn svg{width:15px;height:15px}
  .btn.run{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.check{background:var(--good);border-color:var(--good);color:#fff}
  .btn.ghost{background:transparent}.btn:hover{filter:brightness(1.05)}.spacer{margin-left:auto}
  .editor-wrap{border:1px solid var(--editor-line);border-radius:14px;overflow:hidden;background:var(--editor-bg)}
  .editor-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--editor-line);color:#b9b1a2;font-family:var(--mono);font-size:.76rem}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  textarea#code{width:100%;min-height:330px;resize:vertical;border:0;outline:0;background:var(--editor-bg);color:var(--editor-fg);font-family:var(--mono);font-size:13px;line-height:1.65;padding:14px 16px;tab-size:2;white-space:pre;overflow:auto}
  .todo-hint{font-size:.78rem;color:var(--muted);margin:8px 2px 0}.todo-hint code{background:var(--line);padding:1px 5px;border-radius:5px;font-family:var(--mono);font-size:.74rem}
  .preview-wrap{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  .preview-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted)}
  .preview-bar .pill{margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 9px;font-family:var(--mono);font-size:.7rem}
  iframe#preview{width:100%;height:360px;border:0;background:#fff;display:block}
  .console{font-family:var(--mono);font-size:.76rem;color:var(--muted);background:var(--bg);border-top:1px solid var(--line);padding:8px 12px;max-height:92px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .console:empty{display:none}.console .err{color:var(--bad)}
  .note{color:var(--muted);font-size:.82rem;margin-top:16px}
  .prog{display:flex;align-items:center;gap:10px}
  .prog .bar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .prog .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .prog span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none}
  @media (prefers-reduced-motion:reduce){.goal,.btn,.labcard,.prog .bar i{transition:none}}
</style>
</head>

<script type="text/plain" id="country-explorer.solution">
const app = document.getElementById("app");
const search = document.getElementById("search");
function render(list){
  app.innerHTML = list.map(c => `
    <article class="card">
      <span class="flag">${c.flag}</span>
      <div><b>${c.name}</b><small>${c.region} · ${c.population.toLocaleString()}</small></div>
    </article>`).join("");
}
render(COUNTRIES);
search.addEventListener("input", () => {
  const q = search.value.toLowerCase();
  render(COUNTRIES.filter(c => c.name.toLowerCase().includes(q)));
});
</script>

<script type="text/plain" id="github-card.starter">
// Build a profile card from the real GitHub API (no key needed).
const app = document.getElementById("app");
const input = document.getElementById("user");
const btn = document.getElementById("go");

async function load(username){
  app.innerHTML = "<p class='muted'>Loading…</p>";
  try{
    const res = await fetch("https://api.github.com/users/" + username);
    if(!res.ok) throw new Error("No user called '" + username + "'");
    const u = await res.json();
    app.innerHTML = `
      <article class="profile">
        <img class="avatar" src="  /* TODO 2: put ${u.avatar_url} here */  " alt="">
        <h2>${u.name || u.login}</h2>
        <p class="bio">${u.bio || ""}</p>
        <div class="stats">
          <span><b>${u.public_repos}</b> repos</span>
          <span><b>  /* TODO 3: put ${u.followers} here */  </b> followers</span>
        </div>
      </article>`;
  }catch(e){ app.innerHTML = "<p class='muted'>" + e.message + "</p>"; }
}

      skills:["Rendering a list","Search filter","Template strings"], api:"Built-in data", live:false,
      body:'<input id="search" placeholder="Search countries…" autocomplete="off"><div id="app"></div>', css:gridCss, boot:"var COUNTRIES="+JSON.stringify(COUNTRIES)+";", delay:120,
      goals:[{t:"Countries show up",h:"Make sure render(COUNTRIES) runs."},{t:"Flags appear on cards",h:"TODO 2: put <code>${c.flag}</code> between the quotes."},{t:"Search filters the list",h:"TODO 3: return <code>c.name.toLowerCase().includes(q)</code>."}],
      check:function(doc){ var cards=doc.querySelectorAll("#app .card");
        var g0=cards.length>=10;
        var g1=[].some.call(cards,function(c){var f=c.querySelector(".flag");return f&&f.textContent.trim().length>0&&!/TODO/.test(f.textContent);});
        var g2=false,inp=doc.getElementById("search");
        if(inp){inp.value="ind";inp.dispatchEvent(new Event("input"));var now=doc.querySelectorAll("#app .card");g2=now.length>=1&&now.length<cards.length&&[].every.call(now,function(c){return /ind/i.test(c.textContent);});inp.value="";inp.dispatchEvent(new Event("input"));}
        return [g0,g1,g2]; } },

    { id:"github-card", track:"Frontend & Full Stack", title:"GitHub Profile Card", level:"Beginner", minutes:12, glyph:"🐙", thumb:"#eef0f4",
      tagline:"Call the real GitHub API and build a profile card for any username.",
      skills:["fetch + async/await","Reading JSON","Handling errors"], api:"GitHub API (free, no key)", live:true,
      body:'<div class="controls"><input id="user" value="octocat" autocomplete="off"><button id="go">Load</button></div><div id="app"></div>', css:ghCss, boot:"", delay:2000,
      goals:[{t:"A profile loads",h:"The default user should appear on Run."},{t:"The avatar image shows",h:"TODO 2: put <code>${u.avatar_url}</code> in the img src."},{t:"Follower count shows",h:"TODO 3: put <code>${u.followers}</code> in the followers slot."}],
      check:function(doc){ var h=doc.querySelector("#app .profile h2"), img=doc.querySelector("#app .avatar"), txt=(doc.querySelector("#app")||{}).textContent||"";
        var g0=!!(h&&h.textContent.trim());
        var g1=!!(img&&/^https?:/.test(img.getAttribute("src")||""));
        var g2=/\d+\s*followers/i.test(txt.replace(/\s+/g," "));
        return [g0,g1,g2]; } },

    { id:"dog-gallery", track:"Frontend & Full Stack", title:"Dog Gallery", level:"Beginner", minutes:8, glyph:"🐶", thumb:"#f3eee6",
      tagline:"Pull nine random dog photos from a free API and lay them out in a grid.",
      skills:["fetch","Mapping an array","Image grids"], api:"Dog API (free, no key)", live:true,
      body:'<div id="app"></div>', css:dogCss, boot:"", delay:2000,
      goals:[{t:"Photos are fetched",h:"The grid should fill after Run."},{t:"Images actually display",h:"TODO 2: put <code>${url}</code> in the img src."}],
      check:function(doc){ var imgs=doc.querySelectorAll("#app img.dog");
        var g0=imgs.length>=6;
        var g1=imgs.length>=6&&[].every.call(imgs,function(i){return /^https?:/.test(i.getAttribute("src")||"");});
        return [g0,g1]; } },

    { id:"playground", track:"Custom", title:"Playground", level:"Sandbox", minutes:0, glyph:"✦", thumb:"custom", custom:true,
      tagline:"A blank canvas. Build any idea — fetch any free API, render anything.",
      skills:["Anything you want"], api:"Bring your own", live:true,
      body:'<div id="app"></div>', css:"#app{font-family:inherit}", boot:"", delay:300, goals:[], check:function(){return [];} }
  ];

  var SOON = [
    { track:"AI & LLM", items:["Chatbot UI","Sentiment analyser","Image-caption viewer"] },
    { track:"DevOps & Cloud", items:["Status dashboard","Log viewer","Uptime pinger"] }
  ];

  // ---------- progress ----------
  var DONE = {};
  try{ DONE = JSON.parse(localStorage.getItem("forge-labs-done")||"{}"); }catch(e){}
  function saveDone(){ try{ localStorage.setItem("forge-labs-done", JSON.stringify(DONE)); }catch(e){} }
  var labById = function(id){ return LABS.filter(function(l){return l.id===id;})[0]; };

  // ---------- theme ----------
  try{ var t=localStorage.getItem("forge-labs-theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
  $("#themeBtn").addEventListener("click", function(){
    var root=document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    root.dataset.theme = dark?"light":"dark";
    try{ localStorage.setItem("forge-labs-theme", root.dataset.theme); }catch(e){}
  });

  // ---------- gallery ----------
  function galleryHTML(){
    var tracks = {};
    LABS.forEach(function(l){ (tracks[l.track]=tracks[l.track]||[]).push(l); });
    var order=["Frontend & Full Stack","Custom"];
    var done=Object.keys(DONE).length;
    var html = '<section class="hero">'
      +'<span class="eyebrow">Learn by building, not reading</span>'
      +'<h1>Pick a project. <em>Build it for real.</em></h1>'
      +'<p>Every lab drops you into a code editor with a half-finished app. You fix the gaps, hit Run, watch it work on live data, and get your work checked instantly. No walls of text.</p>'
      +'<div class="chips"><span class="hchip"><b>'+LABS.filter(function(l){return !l.custom;}).length+'</b> project labs</span><span class="hchip"><b>Live</b> free APIs</span><span class="hchip"><b>'+done+'</b> completed by you</span></div>'
      +'</section>';
    order.forEach(function(tr){
      var ls=tracks[tr]; if(!ls) return;
      html += '<section class="track"><div class="track-h"><h2>'+tr+'</h2><span>'+ls.length+' lab'+(ls.length>1?"s":"")+'</span></div><div class="grid">';
      ls.forEach(function(l){ html += labCardHTML(l); });
      html += '</div></section>';
    });
    SOON.forEach(function(s){
      html += '<section class="track"><div class="track-h"><h2>'+s.track+'</h2><span>coming soon</span></div><div class="grid">';
      s.items.forEach(function(name){
        html += '<div class="labcard soon"><div class="thumb" style="background:var(--line2)"></div><div class="b"><h3>'+name+'</h3><p>Coming soon</p></div></div>';
      });
      html += '</div></section>';
    });
    return html;
  }
  function labCardHTML(l){
    var bg = l.thumb==="custom" ? "" : 'style="background:'+l.thumb+'"';
    var cls = "labcard"+(l.custom?" custom":"");
    return '<button class="'+cls+'" data-open="'+l.id+'">'
      +'<div class="thumb" '+bg+'>'+l.glyph+'<span class="lvl">'+l.level+'</span></div>'
      +'<div class="b"><h3>'+l.title+'</h3><p>'+l.tagline+'</p>'
      +'<div class="meta"><span class="tag api">'+l.api+'</span>'+(l.minutes?'<span class="tag">'+l.minutes+' min</span>':'')
      +(DONE[l.id]?'<span class="status">✓ Done</span>':'')+'</div></div></button>';
  }

  // fix the stray soon-card glyph (kept simple)
  function cleanSoon(root){ [].forEach.call(root.querySelectorAll(".labcard.soon .thumb"), function(t){ t.textContent="•••"; }); }

  // ---------- lab runtime ----------
  var current=null, passed=[];
  function buildDoc(lab, userCode){
    var head='<meta charset="utf-8"><style>'+baseCss+lab.css+'</style>';
    var shim='var _log=function(m,c){parent.postMessage({t:"log",m:String(m),cls:c||""},"*")};'
      +'console.log=function(){_log([].join.call(arguments," "))};console.error=function(){_log([].join.call(arguments," "),"err")};'
      +'window.onerror=function(m){_log(m,"err");return true};';
    var run='try{\n'+userCode+'\n}catch(e){console.error(e.message)}';
    return head+lab.body+'<scr'+'ipt>'+lab.boot+shim+run+'</scr'+'ipt>';
  }
  function runCode(){
    var code=$("#code").value, frame=$("#preview"), con=$("#console");
    con.innerHTML=""; frame.srcdoc=buildDoc(current, code);
  }
  function setGoal(i,on){
    passed[i]=on;
    var els=document.querySelectorAll(".goal"); if(els[i]) els[i].classList.toggle("done",on);
    var n=passed.filter(Boolean).length, tot=current.goals.length;
    $("#pbar").style.width=(tot?n/tot*100:0)+"%"; $("#ptxt").textContent=n+" / "+tot+" goals";
    return n;
  }
  function doCheck(){
    runCode();
    setTimeout(function(){
      var doc=$("#preview").contentDocument, verdict=$("#verdict"), win=$("#win");
      var res=[]; try{ res=current.check(doc)||[]; }catch(e){ res=[]; }
      current.goals.forEach(function(_,i){ setGoal(i, !!res[i]); });
      var n=passed.filter(Boolean).length;
      var fails=[];
      current.goals.forEach(function(g,i){ if(!res[i]) fails.push(g.h); });
      if(current.goals.length && n===current.goals.length){
        verdict.hidden=true; win.hidden=false; markDone(); celebrate();
      } else {
        win.hidden=true; verdict.hidden=false; verdict.className="verdict no";
        verdict.innerHTML="<b>"+n+" of "+current.goals.length+" passing.</b><ul><li>"+fails.join("</li><li>")+"</li></ul>";
      }
    }, current.delay||300);
  }
  function markDone(){ if(current && !current.custom){ DONE[current.id]=1; saveDone(); } }

  function labHTML(lab){
    var goals = lab.goals.map(function(g){ return '<li class="goal"><span class="tick"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><b>'+g.t+'</b></span></li>'; }).join("");
    var left = lab.custom
      ? '<span class="eyebrow">Sandbox</span><h1>'+lab.title+'</h1><p class="lede">'+lab.tagline+' There are no checks here — just build. The preview has a <code>#app</code> div to render into.</p>'
      : '<span class="eyebrow">'+lab.track+' · '+lab.level+' · '+lab.minutes+' min</span><h1>'+lab.title+'</h1><p class="lede">'+lab.tagline+'</p>'
        +'<ul class="goals">'+goals+'</ul><div class="verdict" id="verdict" hidden></div>'
        +'<div class="win" id="win" hidden><h3>🎉 Lab complete!</h3><p>Every goal passes. You just built a working, data-driven feature — the real thing, not a worksheet.</p></div>';
    var apiNote = lab.live ? 'Live data from '+lab.api : lab.api;
    return '<div class="crumbs"><button id="back">← All labs</button><span>/</span><span>'+lab.title+'</span></div>'
      +'<div class="work"><section class="panel">'+left+'</section>'
      +'<section><div class="toolbar">'
        +'<button class="btn run" id="runBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M7 5v14l11-7z" fill="currentColor"/></svg>Run</button>'
        +(lab.custom?'':'<button class="btn check" id="checkBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Check my work</button><button class="btn ghost" id="solBtn">Show solution</button>')
        +'<button class="btn ghost spacer" id="resetBtn">Reset</button></div>'
      +'<div class="editor-wrap"><div class="editor-bar"><span class="dot" style="background:#e06c54"></span><span class="dot" style="background:#e3b341"></span><span class="dot" style="background:#4ac08a"></span><span style="margin-left:6px">app.js</span></div>'
      +'<textarea id="code" spellcheck="false" aria-label="Code editor"></textarea></div>'
      +(lab.custom?'':'<p class="todo-hint">Find the <code>// TODO</code> comments — each is one small change with the hint right there. Stuck? Hit <b>Show solution</b>.</p>')
      +'<div class="preview-wrap"><div class="preview-bar">Live preview<span class="pill">'+apiNote+'</span></div>'
      +'<iframe id="preview" title="Live preview"></iframe><div class="console" id="console"></div></div></section></div>';
  }

  // ---------- router ----------
  function render(){
    var app=$("#app"), hash=location.hash||"";
    var m=hash.match(/^#lab-([a-z0-9-]+)$/), lab=m&&labById(m[1]);
    if(lab){
      current=lab; passed=[]; $("#headProg").hidden=false;
      app.innerHTML=labHTML(lab);
      var code=$("#code"); code.value=read(lab.id+".starter");
      code.addEventListener("keydown", function(e){ if(e.key==="Tab"){ e.preventDefault(); var s=code.selectionStart,en=code.selectionEnd; code.value=code.value.slice(0,s)+"  "+code.value.slice(en); code.selectionStart=code.selectionEnd=s+2; }});
      $("#runBtn").addEventListener("click", runCode);
      $("#back").addEventListener("click", function(){ location.hash=""; });
      if(!lab.custom){
        $("#checkBtn").addEventListener("click", doCheck);
        $("#solBtn").addEventListener("click", function(){ code.value=read(lab.id+".solution"); runCode(); });
        lab.goals.forEach(function(_,i){ setGoal(i,false); });
      } else { $("#pbar").style.width="0%"; $("#ptxt").textContent="sandbox"; }
      $("#resetBtn").addEventListener("click", function(){ code.value=read(lab.id+".starter"); $("#console").innerHTML=""; if($("#win"))$("#win").hidden=true; if($("#verdict"))$("#verdict").hidden=true; lab.goals.forEach(function(_,i){ setGoal(i,false); }); runCode(); });
      runCode();
      window.scrollTo(0,0);
    } else {
      current=null; $("#headProg").hidden=true;
      app.innerHTML=galleryHTML(); cleanSoon(app);
      [].forEach.call(app.querySelectorAll("[data-open]"), function(b){ b.addEventListener("click", function(){ location.hash="#lab-"+b.getAttribute("data-open"); }); });
      window.scrollTo(0,0);
    }
  }
  window.addEventListener("hashchange", render);
  window.addEventListener("message", function(e){ if(!e.data||e.data.t!=="log")return; var c=$("#console"); if(!c)return; var d=document.createElement("div"); if(e.data.cls)d.className=e.data.cls; d.textContent=e.data.m; c.appendChild(d); });
  $("#homeBtn").addEventListener("click", function(){ location.hash=""; });

  // ---------- confetti ----------
  function celebrate(){
    if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    var cv=$("#confetti"), ctx=cv.getContext("2d"); cv.style.display="block"; cv.width=innerWidth; cv.height=innerHeight;
    var cols=["#d4831a","#1b9c6b","#e3b341","#4ac08a","#e06c54"];
    var P=[]; for(var i=0;i<140;i++) P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:4+Math.random()*5,c:cols[Math.random()*cols.length|0],vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,rot:Math.random()*6,vr:-.2+Math.random()*.4});
    var t=0;(function f(){ t++; ctx.clearRect(0,0,cv.width,cv.height); P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r,p.r*2,p.r*1.3);ctx.restore();}); if(t<160)requestAnimationFrame(f); else cv.style.display="none"; })();
  }

  render();
})();
</script>
</body>
</html>
