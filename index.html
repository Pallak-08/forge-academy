<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Forge Academy: free, structured career roadmaps for 14 tech roles: stages, modules and lessons with notes, hands-on labs, quizzes and projects.">
<meta property="og:title" content="Forge Academy: find your path in tech, then walk it">
<meta property="og:description" content="Free career roadmaps with notes, hands-on labs, quizzes and projects for 14 in-demand tech roles.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Forge Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar; curriculum rail on the left (drawer on phones); one reading column for lessons. */
:root {
  --bg: #f1f3ee; --surface: #ffffff; --sunk: #e7eae3; --ink: #18201c; --muted: #5b6560; --line: #d6dbd2;
  --accent: #0e7563; --accent-ink: #ffffff; --accent-soft: #d5ece6; --mark: #f2cf4e; --mark-ink: #3d3200;
  --good: #1f7a3d; --good-soft: #dcefe1; --bad: #b3361f; --bad-soft: #f7e0da;
  --code-bg: #141a19; --code-ink: #dfe7e3; --code-line: #26302e;
  --lv1: #2f6fb3; --lv2: #0e7563; --lv3: #9a5a12; --lv4: #7a3fb0; --lv5: #b3361f;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px; --rail: 300px; --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1312; --surface: #161c1a; --sunk: #1c2421; --ink: #e4e9e6; --muted: #97a39d; --line: #2a3330;
    --accent: #3cc0a3; --accent-ink: #062019; --accent-soft: #163a32; --mark: #e6c449; --mark-ink: #2a2200;
    --good: #5cc983; --good-soft: #17301f; --bad: #f08a72; --bad-soft: #3a1d17;
    --code-bg: #0b0f0e; --code-ink: #dfe7e3; --code-line: #1f2826;
    --lv1: #7fb0ea; --lv2: #3cc0a3; --lv3: #e0a050; --lv4: #b98ae6; --lv5: #f08a72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1312; --surface: #161c1a; --sunk: #1c2421; --ink: #e4e9e6; --muted: #97a39d; --line: #2a3330;
  --accent: #3cc0a3; --accent-ink: #062019; --accent-soft: #163a32; --mark: #e6c449; --mark-ink: #2a2200;
  --good: #5cc983; --good-soft: #17301f; --bad: #f08a72; --bad-soft: #3a1d17;
  --code-bg: #0b0f0e; --code-ink: #dfe7e3; --code-line: #1f2826;
  --lv1: #7fb0ea; --lv2: #3cc0a3; --lv3: #e0a050; --lv4: #b98ae6; --lv5: #f08a72;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--f-body); }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 6px; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--sunk); padding: .08em .35em; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.eyebrow { font: 600 11.5px/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top); display: flex; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: #18201c; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 18px; height: 18px; }
.brand b { font: 800 19px/1 var(--f-display); white-space: nowrap; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.overall { flex: 1; display: flex; align-items: center; gap: 12px; justify-content: flex-end; min-width: 0; }
.overall .bar { width: min(260px, 30vw); height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.overall .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.overall span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
.theme-btn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: grid; place-items: center; }
.theme-btn svg { width: 16px; height: 16px; }

/* shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100% - var(--top)); }
.rail { border-right: 1px solid var(--line); background: var(--surface); position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 14px 12px 40px max(12px, env(safe-area-inset-left, 0px)); }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.rail-nav { display: flex; flex-direction: column; gap: 2px; margin: 12px 0 8px; }
.rail-link { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 500; font-size: 14.5px; }
.rail-link:hover, .rail-link.on { background: var(--sunk); }
.level-h { display: flex; align-items: center; gap: 8px; margin: 18px 10px 6px; }
.level-h .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lvc); }
.mod { border-radius: 8px; }
.mod > button { width: 100%; text-align: left; background: none; border: 0; display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: center; padding: 7px 8px; border-radius: 8px; font-size: 14px; }
.mod > button:hover { background: var(--sunk); }
.mod.on > button { background: var(--accent-soft); }
.mod .num { font: 600 11px/1 var(--f-mono); color: var(--muted); }
.mod .cnt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mod ol { list-style: none; margin: 2px 0 6px 32px; padding: 0; border-left: 1px solid var(--line); }
.mod li a { display: flex; gap: 8px; align-items: baseline; padding: 4px 10px; font-size: 13.5px; color: var(--muted); text-decoration: none; border-radius: 0 6px 6px 0; }
.mod li a:hover { color: var(--ink); background: var(--sunk); }
.mod li a.on { color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.tick { width: 14px; height: 14px; flex: none; border-radius: 4px; border: 1.5px solid var(--line); display: inline-grid; place-items: center; transform: translateY(2px); }
.tick.done { background: var(--mark); border-color: var(--mark); }
.tick.done::after { content: ""; width: 7px; height: 4px; border: 2px solid var(--mark-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.wide { max-width: 1080px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: end; padding: 8px 0 6px; }
.hero h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--mark) 62%, var(--mark) 92%, transparent 92%); padding: 0 .08em; color: var(--ink); }
.hero p { color: var(--muted); max-width: 58ch; margin: 12px 0 0; }
.continue { background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.continue .eyebrow { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.continue h3 { font-size: 20px; }
.continue .meta { font-size: 13px; color: color-mix(in srgb, var(--bg) 70%, transparent); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 8px; padding: 9px 15px; font-weight: 600; font-size: 14.5px; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-quiet { background: var(--sunk); color: var(--ink); }
.btn-line { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn[disabled] { opacity: .5; cursor: default; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; }
.stat b { display: block; font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.level-block { display: flex; flex-direction: column; gap: 10px; }
.level-title { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--lvc); padding-bottom: 6px; }
.level-title h2 { font-size: 20px; }
.level-title span { color: var(--muted); font-size: 13.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 15px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--lvc, var(--accent)); transform: translateY(-1px); }
.card .row { display: flex; justify-content: space-between; align-items: center; }
.card .n { font: 600 12px/1 var(--f-mono); color: var(--lvc); }
.card h3 { font-size: 17px; }
.card p { margin: 0; font-size: 13.5px; color: var(--muted); }
.mini { height: 5px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--lvc, var(--accent)); }
.path { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; counter-reset: p; }
.path a { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 500; display: flex; flex-direction: column; gap: 6px; }
.path a b { font: 600 11px/1 var(--f-mono); color: var(--muted); }

/* module & lesson */
.mod-head { display: flex; flex-direction: column; gap: 10px; }
.mod-head h1 { font-size: clamp(28px, 4vw, 40px); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--lvc); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lvc); }
.lede { color: var(--muted); font-size: 16.5px; margin: 0; max-width: 64ch; }
.saas { border: 1px solid var(--line); border-left: 4px solid var(--mark); background: var(--surface); padding: 12px 15px; border-radius: 0 8px 8px 0; font-size: 14.5px; }
.saas b { font-family: var(--f-display); }
.lesson-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.lesson-list a { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; text-decoration: none; color: var(--ink); border-top: 1px solid var(--line); }
.lesson-list a:first-child { border-top: 0; }
.lesson-list a:hover { background: var(--sunk); }
.lesson-list small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.lesson-list .go { color: var(--muted); font-size: 13px; }
.lesson-head h1 { font-size: clamp(26px, 4vw, 38px); margin-top: 4px; }
.subs { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.subs ul { margin: 4px 0 0; padding-left: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; font-size: 14.5px; }
.prose p { margin: 0 0 12px; max-width: 68ch; }
.prose p:last-child { margin-bottom: 0; }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-h h2 { font-size: 19px; }
.code { background: var(--code-bg); color: var(--code-ink); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--code-line); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--code-line); font: 12px/1 var(--f-mono); color: #8fa19a; }
.code-bar button { background: #22302c; color: #dfe7e3; border: 0; border-radius: 6px; padding: 5px 10px; font-size: 12px; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 13.2px/1.6 var(--f-mono); tab-size: 4; }
.code pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-doctag { color: #7cc7ff; }
.hljs-string, .hljs-attr + .hljs-string, .hljs-regexp { color: #b5e28a; }
.hljs-number, .hljs-literal { color: #f5b971; }
.hljs-comment, .hljs-quote { color: #6f817b; font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-section { color: #f2cf4e; }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-variable, .hljs-params { color: #d6c3ff; }
.hljs-meta, .hljs-tag, .hljs-name { color: #8fd8c8; }
.hljs-type, .hljs-class .hljs-title { color: #ffaf9e; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 18px; }
textarea, .field { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 10px 12px; font: 14px/1.5 var(--f-body); resize: vertical; }
textarea.mono { font-family: var(--f-mono); font-size: 13px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 12.5px; color: var(--muted); }
.quiz-q { font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: baseline; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt b { font: 600 12px/1 var(--f-mono); color: var(--muted); }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.verdict { font-size: 14px; padding: 10px 12px; border-radius: 8px; }
.verdict.ok { background: var(--good-soft); }
.verdict.no { background: var(--bad-soft); }
.tutor-out { font-size: 14.5px; border-top: 1px dashed var(--line); padding-top: 12px; }
.tutor-out:empty { display: none; }
.tutor-out p { margin: 0 0 10px; }
.tutor-out pre { background: var(--code-bg); color: var(--code-ink); padding: 12px; border-radius: 8px; overflow-x: auto; font: 13px/1.55 var(--f-mono); }
.tutor-out pre code { background: none; padding: 0; color: inherit; }
.tutor-out ul, .tutor-out ol { margin: 0 0 10px; padding-left: 22px; }
.chat-turn { display: flex; flex-direction: column; gap: 4px; }
.chat-turn .who { font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chat-log { display: flex; flex-direction: column; gap: 14px; }
.chat-log:empty { display: none; }
.lesson-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.done-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--mark); color: var(--mark-ink); padding: 6px 12px; border-radius: 99px; font-weight: 600; font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }

/* projects */
.proj { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 14px; }
.proj .big { font: 800 34px/1 var(--f-display); color: var(--accent); }
.proj h3 { font-size: 19px; }
.proj p { margin: 4px 0 8px; color: var(--muted); font-size: 14.5px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks label { display: flex; gap: 10px; align-items: baseline; font-size: 14.5px; cursor: pointer; }
.checks input { accent-color: var(--accent); transform: translateY(2px); }
.mods-used { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.mods-used a { font-size: 12px; background: var(--sunk); color: var(--ink); text-decoration: none; padding: 3px 8px; border-radius: 99px; }


.card.track.chosen { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card.track .n { color: var(--accent); }
.roles { font-size: 13px; color: var(--ink); font-weight: 500; }
.chip { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--ink); }
.chip.lvl-beginner { background: var(--good-soft); }
.chip.lvl-intermediate { background: color-mix(in srgb, var(--mark) 35%, var(--surface)); }
.chip.lvl-advanced { background: var(--bad-soft); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps .step-n { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--lvc); display: grid; place-items: center; font: 600 12px/1 var(--f-mono); color: var(--lvc); }
.steps li.full .step-n { background: var(--lvc); color: var(--surface); }
.steps a { text-decoration: none; color: var(--ink); }
.steps small { display: block; color: var(--muted); font-size: 13px; }
.idea { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.idea .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.idea h3 { font-size: 17px; }
.idea p { margin: 0; font-size: 14.5px; }
.idea ul { margin: 2px 0 4px; padding-left: 20px; font-size: 14px; }
.built { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
.built input { accent-color: var(--accent); }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.ideas .idea { background: var(--surface); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 14px; font-weight: 500; }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.site-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; font-size: 13px; color: var(--muted); }
.site-foot a { color: var(--muted); }
.scrim { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .rail { position: fixed; left: 0; top: calc(var(--top) + env(safe-area-inset-top, 0px)); bottom: 0; width: min(330px, 88vw); z-index: 40; transform: translateX(-102%); transition: transform .25s; height: auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  body.drawer .rail { transform: none; }
  body.drawer .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 35; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .path { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .overall .bar { display: none; }
  .sync { display: none; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      const snap = await ref.get();
      if (snap.exists) { S = merge(S, snap.data() || {}); try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
      remote = ref; setSync("Saved to your account"); renderTree(); render();
    } catch (e) {}
  })();

  /* ---------- AI tutor (only inside Claude) ---------- */
  let sample = null, tutorOff = false;
  (async () => { try { if (window.claude && window.claude.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; } showTutor(); })();

  function md(t) {
    return String(t).split(/```[a-zA-Z0-9_+-]*\n?/).map((p, i) => {
      if (i % 2) return `<pre><code>${esc(p.replace(/\n$/, ""))}</code></pre>`;

  const BASE = `You are a patient, precise tutor inside "Forge Academy", a free platform with complete career roadmaps (role → stages → modules → lessons, each with notes, code, labs, quizzes and projects) for students and early-career people. Teach clearly and concretely: short paragraphs, small runnable examples in fenced code blocks, plain language.`;
  async function ask(out, input, btns, opts = {}) {

      html: `<section class="panel" data-tutor hidden>
        <div class="section-h"><h2>Ask the tutor</h2><span class="hint">Uses your Claude account</span></div>
        <div class="row-btns">${Object.entries(quick).map(([k, v]) => `<button class="btn btn-quiet" type="button" data-quick="${k}">${esc(v[0])}</button>`).join("")}</div>
        <div class="chat-log" id="chatLog"></div>
        <textarea id="askBox" rows="2" placeholder="Ask anything about this, or paste an error you got"></textarea>
        <div class="row-btns"><button class="btn btn-primary" type="button" id="askBtn">Ask</button><span class="hint">The conversation lasts until you leave this page.</span></div>
      </section>`,
      bind(extra = () => []) {
        showTutor(); if (!sample) return;
        const turns = [], log = $("#chatLog");
        const btns = () => Array.from(document.querySelectorAll("#askBtn, [data-quick]")).concat(extra());
        async function chat(q) {
          turns.push({ role: "user", content: q });
          const you = document.createElement("div"); you.className = "chat-turn"; you.innerHTML = `<span class="who">You</span><div>${esc(q)}</div>`;
          const ans = document.createElement("div"); ans.className = "chat-turn"; ans.innerHTML = '<span class="who">Tutor</span><div class="tutor-out"></div>';
          log.append(you, ans);
          const text = await ask(ans.querySelector(".tutor-out"), [{ role: "user", content: contextFn() + "\n\nThe learner's questions follow. Answer the latest one." }, ...turns.slice(-8)], btns(), { cache: false });
          if (text) turns.push({ role: "assistant", content: text }); else turns.pop();
        }
        $("#askBtn").addEventListener("click", () => { const q = $("#askBox").value.trim(); if (!q) return; $("#askBox").value = ""; chat(q); });
        $("#askBox").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#askBtn").click(); });
        document.querySelectorAll("[data-quick]").forEach((b) => b.addEventListener("click", () => chat(quick[b.dataset.quick][1])));
      }
    };
  }

  /* ---------- paths: a role, minus skipped modules, plus added modules ---------- */
  function myRole() {
    const base = ROLES.find((r) => r.id === S.role) || null;
    const stages = base ? base.stages.map((s) => Object.assign({}, s, { mods: s.mods.filter((m) => !S.skip[m]) })) : [];
    const have = new Set(stages.flatMap((s) => s.mods));
    const extras = Object.keys(S.extra).filter((id) => S.extra[id] && modById(id) && !have.has(id));
    extras.sort((a, b) => AREAS.findIndex((x) => x.id === modById(a).area) - AREAS.findIndex((x) => x.id === modById(b).area));
    if (extras.length) stages.push({ t: "Modules you added", goal: base ? `Extra modules beyond the ${base.title} roadmap.` : "Modules you picked from the catalog.", mods: extras, extra: true });
    const skipped = base ? [...new Set(base.stages.flatMap((s) => s.mods))].filter((m) => S.skip[m]) : [];
    return { id: "my", title: "My path", glyph: "ME", base, extras, skipped, stages, ref: base ? base.ref : "",
      tagline: base ? `Built on ${base.title}, customised by you.` : "Modules you picked yourself.", who: "", jobs: base ? base.jobs : [], duration: base ? base.duration : "",
      big: base ? base.big : null, capstone: base ? base.capstone : null, jobReady: base ? base.jobReady : [], interview: base ? base.interview : [] };
  }
  const hasPath = () => !!(S.role || Object.values(S.extra).some(Boolean));
  const roleOf = (id) => (id === "my" ? myRole() : ROLES.find((r) => r.id === id));
  const pathMods = (r) => { const seen = new Set(), out = []; r.stages.forEach((s, si) => s.mods.forEach((id) => { if (!seen.has(id) && modById(id)) { seen.add(id); out.push({ id, si }); } })); return out; };
  const inPath = (id) => hasPath() && pathMods(myRole()).some((x) => x.id === id);
  function addToPath(id) { if (S.skip[id]) delete S.skip[id]; else S.extra[id] = 1; save(); }
  function removeFromPath(id) { if (S.extra[id]) delete S.extra[id]; else S.skip[id] = 1; save(); }

  /* ---------- progress ---------- */
  const modProgress = (m) => { const ls = lessonsOf(m); return { done: ls.filter((l) => S.done[l.key]).length, total: ls.length, full: ls.filter((l) => l.full).length }; };
  const modDone = (m) => { const p = modProgress(m); return p.total > 0 && p.done === p.total; };
  function roleProgress(r) {
    let done = 0, total = 0, full = 0;
    for (const { id } of pathMods(r)) { const p = modProgress(modById(id)); done += p.done; total += p.total; full += p.full; }
    return { done, total, full, pct: total ? Math.round((done / total) * 100) : 0, fullPct: total ? Math.round((full / total) * 100) : 0 };
  }
  function nextLesson(r) {
    for (const { id, si } of pathMods(r)) { const m = modById(id); const ls = lessonsOf(m); for (let i = 0; i < m.les.length; i++) { const l = lessonAt(m, i); if (l && !S.done[l.key]) return { m, i, l, si }; } }
    return null;
  }
  function paintProgress() {
    const r = hasPath() ? myRole() : null;
    if (r) { const p = roleProgress(r); $("#overallBar").style.width = p.pct + "%"; $("#overallTxt").textContent = `My path: ${p.done} / ${p.total} lessons`; }
    else { $("#overallBar").style.width = "0%"; $("#overallTxt").textContent = "Pick a role to start"; }
    document.querySelectorAll("[data-mstate]").forEach((el) => { const m = modById(el.dataset.mstate); const p = modProgress(m); el.className = "tick " + (p.total && p.done === p.total ? "done" : p.done ? "half" : ""); });
  }

  /* ---------- side navigation ---------- */
  function renderTree(filter = "") {
    const q = filter.trim().toLowerCase();
    let html = "";
    if (q) {
      const mHits = MODS.filter((m) => (m.t + " " + m.d).toLowerCase().includes(q)).slice(0, 20);
      const lHits = [];
      for (const m of MODS) m.les.forEach((_, i) => { const l = lessonAt(m, i); if (l && (l.t + " " + l.sub.join(" ")).toLowerCase().includes(q) && !lHits.some((h) => h.l.key === l.key)) lHits.push({ m, i, l }); });
      html += `<div class="level-h"><span class="eyebrow">Modules (${mHits.length})</span></div><ol class="flat">${mHits.map((m) => `<li><a href="#mod-${m.id}"><span class="tick" data-mstate="${m.id}"></span><span>${esc(m.t)}</span></a></li>`).join("") || '<li class="note" style="padding:4px 10px">No modules match.</li>'}</ol>`;
      html += `<div class="level-h"><span class="eyebrow">Lessons (${lHits.length})</span></div><ol class="flat">${lHits.slice(0, 30).map(({ m, i, l }) => `<li><a href="#l-${m.id}.${i}"><span class="tick ${S.done[l.key] ? "done" : ""}"></span><span>${esc(l.t)}</span></a></li>`).join("") || '<li class="note" style="padding:4px 10px">No lessons match.</li>'}</ol>`;
    } else if (hasPath()) {
      const r = myRole(), p = roleProgress(r);
      html += `<div class="rail-role"><span class="eyebrow">My path · ${p.pct}%</span><a href="#my"><b>${esc(r.base ? r.base.title : "Custom path")}</b></a><span class="rail-meta">${r.extras.length ? `+${r.extras.length} added` : ""}${r.extras.length && r.skipped.length ? " · " : ""}${r.skipped.length ? `${r.skipped.length} skipped` : ""}</span><span class="rail-links"><a class="note" href="#my">Customise</a><a class="note" href="#catalog">Add modules</a></span></div>`;
      r.stages.forEach((s, si) => {
        html += `<div class="level-h"><span class="stage-dot">${s.extra ? "+" : si + 1}</span><span class="eyebrow">${esc(s.t)}</span></div><ol class="flat">${s.mods.filter(modById).map((id) => { const m = modById(id), pr = modProgress(m); return `<li><a href="#mod-${id}" data-modlink="${id}"><span class="tick" data-mstate="${id}"></span><span>${esc(m.t)}</span><span class="cnt">${pr.done}/${pr.total}</span></a></li>`; }).join("")}</ol>`;
      });
    } else {
      html += `<div class="level-h"><span class="eyebrow">Choose a role</span></div><ol class="flat">${ROLES.map((x) => `<li><a href="#r-${x.id}"><span class="glyph sm">${esc(x.glyph)}</span><span>${esc(x.title)}</span></a></li>`).join("")}</ol>`;
    }
    $("#tree").innerHTML = html; paintProgress(); markActive();
  }
  $("#search").addEventListener("input", (e) => renderTree(e.target.value));
  $("#rail").addEventListener("click", (e) => { if (e.target.closest("a")) document.body.classList.remove("drawer"); });
  $("#menuBtn").addEventListener("click", () => document.body.classList.toggle("drawer"));
  $("#scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
  function markActive() {
    const h = location.hash || "#home";
    const curMod = (h.match(/^#mod-([a-z0-9-]+)$/) || h.match(/^#l-([a-z0-9-]+)\./) || [])[1];
    document.querySelectorAll("[data-modlink]").forEach((a) => a.classList.toggle("on", a.dataset.modlink === curMod));
    document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("on", h === "#" + a.dataset.nav || (a.dataset.nav === "roles" && h.startsWith("#r-")) || (a.dataset.nav === "catalog" && (h.startsWith("#mod-") || h.startsWith("#l-")) && !inPath(curMod))));
  }

  /* ---------- theme ---------- */
  $("#themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("forge-academy-theme", root.dataset.theme); } catch (e) {}
  });
  try { const t = localStorage.getItem("forge-academy-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

  /* ---------- shared pieces ---------- */
  const footer = () => `<footer class="site-foot"><span>Forge Academy is a free, open learning platform created by ${esc(AUTHOR)}. All syllabi and lessons are original.</span><span><a href="${REPO}" target="_blank" rel="noopener">Source on GitHub</a> · <a href="#about">About</a></span></footer>`;
  function roleCard(r) {
    const p = roleProgress(r), on = S.role === r.id;
    return `<a class="card role ${on ? "chosen" : ""}" href="#r-${r.id}">
      <div class="row"><span class="glyph">${esc(r.glyph)}</span>${on ? '<span class="chip">My path</span>' : `<span class="note">${r.stages.length} stages · ${pathMods(r).length} modules</span>`}</div>
      <h3>${esc(r.title)}</h3><p>${esc(r.tagline)}</p>
      <p class="roles">${r.jobs.map(esc).join(" · ")}</p>
      <div class="mini"><i style="width:${p.pct}%"></i></div>
      <span class="note">${p.done ? `${p.done} of ${p.total} lessons done` : `${p.total} lessons · ${esc(r.duration)}`}</span></a>`;
  }
  function projCard(id, label, p) {
    const cls = label === "Capstone" ? "lvl-advanced" : label === "Big project" ? "lvl-intermediate" : "lvl-beginner";
    return `<article class="idea"><div class="row"><span class="chip ${cls}">${esc(label)}</span><label class="built"><input type="checkbox" data-pj="${id}" ${S.pj[id] ? "checked" : ""}> I built this</label></div>
      <h3>${esc(p.t)}</h3><p>${esc(p.brief)}</p><ul>${p.features.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></article>`;
  }
  function modCard(m, r, editable) {
    const p = modProgress(m), a = areaById(m.area);
    const link = `<a class="mcard ${p.total && p.done === p.total ? "done" : p.done ? "started" : ""}" href="#mod-${m.id}">
      <div class="row"><span class="tick" data-mstate="${m.id}"></span><span class="note">${p.done}/${p.total} lessons</span></div>
      <h3>${esc(m.t)}</h3><p>${esc(m.d)}</p>
      <div class="node-tags"><span>${p.total} lessons</span><span>${p.full} full</span><span>lab</span><span>project</span>${editable && a ? `<span>${esc(a.t)}</span>` : ""}</div>
      <div class="mini"><i style="width:${p.total ? Math.round((p.done / p.total) * 100) : 0}%"></i></div></a>`;
    return editable ? `<div class="node-wrap">${link}<button class="node-x" type="button" data-unpath="${m.id}" aria-label="Remove ${esc(m.t)} from my path" title="Remove from my path">×</button></div>` : link;
  }
  const lessonRow = (m, i, l) => `<a class="lrow" href="#l-${m.id}.${i}"><span class="tick ${S.done[l.key] ? "done" : ""}"></span><span class="lnum">${i + 1}</span><span class="lt"><b>${esc(l.t)}</b><small>${esc(l.sub.slice(0, 5).join(" · "))}</small></span><span class="badge ${l.full ? "full" : ""}">${l.full ? "Full lesson" : "Outline"}</span></a>`;

  /* ---------- views ---------- */
  function viewHome() {
    const r = hasPath() ? myRole() : null;
    const nx = r ? nextLesson(r) : null;
    const lessonsDone = Object.values(S.done).filter(Boolean).length;
    const modsDone = MODS.filter(modDone).length;
    const labsDone = Object.values(S.labs).filter(Boolean).length;
    const built = Object.values(S.pj).filter(Boolean).length;
    const totalLessons = MODS.reduce((s, m) => s + m.les.length, 0);
    return `<div class="wrap wide">
      <section class="hero">
        <div>
          <span class="eyebrow">Free and open · ${ROLES.length} role roadmaps · ${MODS.length} modules · ${totalLessons} lessons</span>
          <h1 style="margin-top:10px">Find your path in tech. <em>Then walk it.</em></h1>
          <p>Every role is a structured roadmap: stages, then modules, then lessons. Each module has notes, worked code, quizzes, a hands-on lab and a project. Start from a role, or build your own path from the module catalog.</p>
          <div class="row-btns" style="margin-top:16px"><a class="btn btn-primary" href="#roles">Pick a role</a><a class="btn btn-line" href="#catalog">Browse modules</a><a class="btn btn-line" href="#library">Lesson library</a>${r ? '<a class="btn btn-line" href="#my">My path</a>' : ""}</div>
        </div>
        <div class="continue">
          ${r && nx ? `<span class="eyebrow">Continue · ${esc(nx.m.t)}</span><h3>${esc(nx.l.t)}</h3><span class="meta">${esc(r.stages[nx.si] ? r.stages[nx.si].t : "")} · lesson ${nx.i + 1} of ${nx.m.les.length}</span><div><a class="btn btn-primary" href="#l-${nx.m.id}.${nx.i}">Continue</a></div>`
          : r ? `<span class="eyebrow">My path</span><h3>Every lesson is done.</h3><span class="meta">Finish the big project and capstone, then the job-ready checklist.</span><div><a class="btn btn-primary" href="#my">Open my path</a></div>`
          : `<span class="eyebrow">Two ways to start</span><h3>Know the job you want?</h3><span class="meta">Pick a role and follow its roadmap stage by stage. Not sure, or want something in between? Start from the closest role and add or skip modules.</span><div class="row-btns"><a class="btn btn-primary" href="#roles">Compare roles</a><a class="btn btn-quiet on-dark" href="#catalog">Browse modules</a></div>`}
        </div>
      </section>
      <section class="stats" aria-label="Your progress">
        <div class="stat"><b>${lessonsDone}</b><span>lessons finished</span></div>
        <div class="stat"><b>${modsDone}</b><span>modules completed</span></div>
        <div class="stat"><b>${labsDone}</b><span>lab steps done</span></div>
        <div class="stat"><b>${built}</b><span>projects built</span></div>
      </section>
      <section class="level-block">
        <div class="level-title" style="--lvc: var(--accent)"><h2>Role roadmaps</h2><span>Each role: stages → modules → lessons, ending in a big project and a capstone</span></div>
        <div class="cards">${ROLES.map(roleCard).join("")}</div>
      </section>
      <section class="level-block">
        <div class="level-title" style="--lvc: var(--mark)"><h2>Module catalog</h2><span>${MODS.length} modules in ${AREAS.length} areas. Add any module to your path</span></div>
        <div class="area-chips">${AREAS.map((a) => `<a class="area-chip" href="#catalog" data-area-jump="${a.id}"><b>${esc(a.t)}</b><span>${MODS.filter((m) => m.area === a.id).length} modules</span></a>`).join("")}</div>
      </section>
      <section class="level-block">
        <div class="level-title" style="--lvc: var(--accent)"><h2>How it is organised</h2><span>The same structure everywhere</span></div>
        <div class="how">
          <div><b>Role</b><p>A complete roadmap for one job, from zero to job-ready, with a job-ready checklist and interview questions.</p></div>
          <div><b>Stage</b><p>A group of modules in the order you should learn them, each with a clear goal.</p></div>
          <div><b>Module</b><p>One skill, such as React or Docker: several lessons, a hands-on lab and a project.</p></div>
          <div><b>Lesson</b><p>Notes, worked code, an exercise and a quiz. Lessons still being written show their full outline.</p></div>
        </div>
      </section>
      ${footer()}
    </div>`;
  }

  function viewRoles() {
    return `<div class="wrap wide">
      <nav class="crumbs"><a href="#home">Home</a><span>›</span><span>Role roadmaps</span></nav>
      <header class="mod-head"><span class="eyebrow">${ROLES.length} roles</span><h1>Role roadmaps</h1><p class="lede">Each roadmap is a complete path for one job: stages in learning order, the modules inside each stage, and the lessons inside each module. Modules shared between roles (like Git or SQL) are the same module, so switching roles never wastes progress.</p></header>
      <div class="banner"><div><b>Want something in between?</b><p>Start from the closest role, then add modules from other areas or skip ones you don't need.</p></div><a class="btn btn-primary" href="#catalog">Browse modules</a></div>
      <div class="cards">${ROLES.map(roleCard).join("")}</div>
      ${footer()}
    </div>`;
  }

  function viewRole(r) {
    const my = r.id === "my";
    const rid = my ? (r.base ? r.base.id : "custom") : r.id;
    const p = roleProgress(r);
    const jrDone = r.jobReady.filter((_, j) => S.jr[`${rid}-${j}`]).length;
    const head = my ? `
      <nav class="crumbs"><a href="#home">Home</a><span>›</span><span>My path</span></nav>
      <header class="mod-head role-head">
        <div class="row-btns"><span class="glyph lg">ME</span><span class="eyebrow">${r.base ? esc(r.base.duration) + " for the base roadmap" : "Custom path"}</span></div>
        <h1>My path</h1>
        <p class="lede">${r.base ? `Built on the <a href="#r-${r.base.id}">${esc(r.base.title)}</a> roadmap${r.extras.length ? `, plus ${r.extras.length} module${r.extras.length > 1 ? "s" : ""} you added` : ""}${r.skipped.length ? `, minus ${r.skipped.length} you skipped` : ""}.` : "A path made only from modules you picked."} Remove any module with ×, or add more from the catalog.</p>
        <div class="base-pick"><span class="eyebrow">Base roadmap</span><div class="tabs">${ROLES.map((x) => `<button type="button" class="tab ${S.role === x.id ? "on" : ""}" data-base="${x.id}">${esc(x.title)}</button>`).join("")}<button type="button" class="tab ${!S.role ? "on" : ""}" data-base="">None</button></div></div>
        <div class="row-btns"><a class="btn btn-primary" href="#catalog">Add modules</a><span class="note">${p.done} of ${p.total} lessons done</span></div>
        <div class="mini big"><i style="width:${p.pct}%"></i></div>
      </header>` : `
      <nav class="crumbs"><a href="#home">Home</a><span>›</span><a href="#roles">Role roadmaps</a><span>›</span><span>${esc(r.title)}</span></nav>
      <header class="mod-head role-head">
        <div class="row-btns"><span class="glyph lg">${esc(r.glyph)}</span><span class="eyebrow">${esc(r.duration)}</span></div>
        <h1>${esc(r.title)}</h1><p class="lede">${esc(r.tagline)} ${esc(r.who)}</p>
        <p class="roles" style="margin:0">Job titles: ${r.jobs.map(esc).join(" · ")}</p>
        <div class="row-btns">${S.role === r.id ? '<span class="done-pill">My path is based on this</span><a class="btn btn-line" href="#my">Open my path</a>' : '<button class="btn btn-primary" type="button" id="pickRole">Make this my path</button>'}
          <span class="note">${r.stages.length} stages · ${pathMods(r).length} modules · ${p.total} lessons (${p.fullPct}% fully written, the rest outlined)</span></div>
        <div class="mini big"><i style="width:${p.pct}%"></i></div>
        ${r.ref ? `<p class="hint" style="margin:0">Want a second opinion? Compare with the <a href="${r.ref}" target="_blank" rel="noopener">${esc(r.title)} roadmap on roadmap.sh ↗</a></p>` : ""}
      </header>`;
    const empty = my && !r.stages.length ? `<div class="banner"><div><b>Your path is empty.</b><p>Choose a base roadmap above, or add modules from the catalog.</p></div><a class="btn btn-primary" href="#catalog">Browse modules</a></div>` : "";
    return `<div class="wrap">${head}${empty}
      <section class="roadmap">${r.stages.map((s, si) => {
        const ms = s.mods.map(modById).filter(Boolean);
        const sd = ms.filter(modDone).length;
        return `<div class="stage ${sd === ms.length && ms.length ? "complete" : ""} ${s.extra ? "extra" : ""}">
          <div class="stage-rail"><span class="stage-n">${s.extra ? "+" : si + 1}</span></div>
          <div class="stage-body">
            <div class="section-h"><div><span class="eyebrow">${s.extra ? "Added by you" : "Stage " + (si + 1)} · ${sd}/${ms.length} modules complete</span><h2>${esc(s.t)}</h2></div></div>
            <p class="note" style="margin:0">${esc(s.goal)}</p>
            ${ms.length ? `<div class="mcards">${ms.map((m) => modCard(m, r, my)).join("")}</div>` : '<p class="note" style="margin:0">You skipped every module in this stage.</p>'}
          </div></div>`;
      }).join("")}</section>
      ${my && r.skipped.length ? `<section class="panel"><h2>Skipped modules</h2><p class="hint" style="margin:0">Modules from ${esc(r.base.title)} you removed. Put any back with one click.</p><div class="skip-list">${r.skipped.map((id) => `<button type="button" class="skip-chip" data-repath="${id}">↺ ${esc(modById(id).t)}</button>`).join("")}</div></section>` : ""}
      ${r.big ? `<section class="panel"><h2>Big project</h2>${projCard(`${rid}-big`, "Big project", r.big)}</section>` : ""}
      ${r.capstone ? `<section class="panel"><h2>Final capstone</h2>${projCard(`${rid}-cap`, "Capstone", r.capstone)}</section>` : ""}
      ${r.jobReady.length ? `<section class="panel"><div class="section-h"><h2>Job-ready checklist</h2><span class="note">${jrDone} of ${r.jobReady.length}</span></div>
        <p class="hint" style="margin:0">Tick each item when you can do it without notes and can point to a project that shows it.</p>
        <ul class="checks">${r.jobReady.map((c, j) => { const id = `${rid}-${j}`; return `<li><label><input type="checkbox" data-jr="${id}" ${S.jr[id] ? "checked" : ""}><span>${esc(c)}</span></label></li>`; }).join("")}</ul></section>` : ""}
      ${r.interview.length ? `<section class="panel"><h2>Common interview questions</h2>
        <ol class="iq">${r.interview.map((q, j) => `<li><span>${esc(q)}</span><button class="btn btn-quiet sm" type="button" data-tutor hidden data-iq="${j}">Practise with the tutor</button></li>`).join("")}</ol>
        <div class="tutor-out" id="iqOut"></div></section>` : ""}
      ${footer()}
    </div>`;
  }

  function ctxRole() { const id = String(S.ctx || ""); return id && roleOf(id) ? roleOf(id) : (hasPath() ? myRole() : null); }
  function neighbours(m) {
    const r = ctxRole(); if (!r) return {};
    const list = pathMods(r); const idx = list.findIndex((x) => x.id === m.id);
    if (idx < 0) return { r: null };
    return { r, idx, total: list.length, stage: r.stages[list[idx].si], prev: idx > 0 ? list[idx - 1].id : "", next: idx < list.length - 1 ? list[idx + 1].id : "" };
  }

  function viewModule(m) {
    const p = modProgress(m), a = areaById(m.area), nb = neighbours(m);
    const roles = rolesWith(m.id);
    const labDone = m.lab.steps.filter((_, i) => S.labs[m.id + "-" + i]).length;
    const tutor = chatBox(() => `${BASE}\nModule: ${m.t}. ${m.d}\nLessons: ${lessonsOf(m).map((l) => l.t).join("; ")}.\nLab: ${m.lab.t}: ${m.lab.steps.join(" / ")}.`, {
      plan: ["Give me a study plan", "Make a 2-week study plan for this module, with what to do each day, which lessons to read, and when to do the lab and project."],
      lab: ["Help me start the lab", "I'm starting this module's hands-on lab. Break the first two steps into smaller actions, list what I need installed, and what success looks like. Do not do the whole lab for me."],
      why: ["Why does this matter at work?", "Explain why this module matters in day-to-day work, with two concrete workplace examples and what interviewers typically ask about it."]
    });
    return { html: `<div class="wrap">
      <nav class="crumbs"><a href="#home">Home</a><span>›</span>${nb.r ? `<a href="${nb.r.id === "my" ? "#my" : "#r-" + nb.r.id}">${esc(nb.r.title)}</a><span>›</span><span>${nb.stage.extra ? "Added by you" : esc(nb.stage.t)}</span>` : `<a href="#catalog">Module catalog</a><span>›</span><span>${esc(a ? a.t : "")}</span>`}</nav>
      <header class="mod-head"><span class="tag" style="--lvc: var(--accent)">${nb.r ? `Module ${nb.idx + 1} of ${nb.total}` : "Module"}${a ? " · " + esc(a.t) : ""}</span><h1>${esc(m.t)}</h1><p class="lede">${esc(m.d)}</p>
        <div class="row-btns">${inPath(m.id) ? `<span class="chip">In my path</span><button class="btn btn-line sm" type="button" data-unpath="${m.id}">Remove from my path</button>` : `<button class="btn btn-line sm" type="button" data-addpath="${m.id}">+ Add to my path</button>`}<span class="note">${p.done} of ${p.total} lessons done · ${p.full} full, ${p.total - p.full} outlined</span></div>
        <div class="mini big"><i style="width:${p.total ? Math.round((p.done / p.total) * 100) : 0}%"></i></div>
        ${roles.length ? `<p class="hint" style="margin:0">Part of: ${roles.map((x) => `<a href="#r-${x.id}">${esc(x.title)}</a>`).join(", ")}</p>` : ""}
      </header>
      <section class="panel"><div class="section-h"><h2>Lessons</h2><span class="note">${p.done}/${p.total}</span></div>
        <div class="lessons">${m.les.map((_, i) => { const l = lessonAt(m, i); return l ? lessonRow(m, i, l) : ""; }).join("")}</div></section>
      <section class="panel lab"><div class="section-h"><h2>Hands-on lab: ${esc(m.lab.t)}</h2><span class="note">${labDone} of ${m.lab.steps.length} steps</span></div>
        <ol class="checks steps-list">${m.lab.steps.map((s, i) => `<li><label><input type="checkbox" data-lab="${m.id}-${i}" ${S.labs[m.id + "-" + i] ? "checked" : ""}><span>${esc(s)}</span></label></li>`).join("")}</ol>
        <p class="done-when"><b>Done when:</b> ${esc(m.lab.done)}</p></section>
      <section class="panel"><h2>Module project</h2>${projCard("m-" + m.id, "Mini project", m.proj)}</section>
      ${tutor.html}
      <footer class="lesson-foot">
        <div class="row-btns">${nb.prev ? `<a class="btn btn-line" href="#mod-${nb.prev}">‹ ${esc(modById(nb.prev).t)}</a>` : ""}</div>
        <div class="row-btns">${nb.next ? `<a class="btn btn-primary" href="#mod-${nb.next}">Next module: ${esc(modById(nb.next).t)} ›</a>` : nb.r ? `<a class="btn btn-primary" href="${nb.r.id === "my" ? "#my" : "#r-" + nb.r.id}">Back to roadmap</a>` : ""}</div>
      </footer>
      ${footer()}
    </div>`, bind() { tutor.bind(); } };
  }

  function viewLesson(m, i) {
    const l = lessonAt(m, i); const k = l.key;
    const prev = i > 0 ? `#l-${m.id}.${i - 1}` : `#mod-${m.id}`;
    const next = i < m.les.length - 1 ? `#l-${m.id}.${i + 1}` : `#mod-${m.id}`;
    const crumbs = `<nav class="crumbs"><a href="#home">Home</a><span>›</span><a href="#mod-${m.id}">${esc(m.t)}</a><span>›</span><span>Lesson ${i + 1} of ${m.les.length}</span></nav>`;
    const foot = `<footer class="lesson-foot"><div class="row-btns"><a class="btn btn-line" href="${prev}">‹ ${i > 0 ? "Previous" : "Module"}</a></div>
      <div class="row-btns">${S.done[k] ? `<span class="done-pill">Completed</span><button class="btn btn-line" type="button" id="undoBtn">Mark as not done</button><a class="btn btn-primary" href="${next}">${i < m.les.length - 1 ? "Next lesson ›" : "Back to module ›"}</a>` : `<button class="btn btn-primary" type="button" id="doneBtn">Mark complete and continue</button>`}</div></footer>`;
    const notesBox = `<section class="panel"><div class="section-h"><h2>My notes</h2><span class="hint">Saved as you type</span></div><textarea id="noteBox" rows="4" placeholder="What clicked, what to revisit, questions for later">${esc(S.notes[k] || "")}</textarea></section>`;
    const ctx = l.full ? `${BASE}\nLesson: ${l.t} (module: ${m.t}).\nSub-topics: ${l.sub.join("; ")}.\nLesson text: ${plain(l.l.body)}\nCode example (${l.l.lang}):\n${l.l.code}` : `${BASE}\nLesson: ${l.t} (module: ${m.t}).\nSub-topics to cover: ${l.sub.join("; ")}.`;
    const quick = l.full ? {
      simpler: ["Explain it more simply", "Explain this lesson again as if I am a beginner, using an everyday analogy, then restate the key idea in two sentences."],
      walk: ["Walk through the code", "Walk through the lesson's code example line by line, saying what each important line does and why."],
      example: ["Show another example", "Give me a different, small, runnable example of the same idea in a new domain, with a short explanation."],
      real: ["How is this used at work?", "How is this lesson's idea used in real production software? Give two or three situations and one common mistake."]
    } : {
      teach: ["Teach me this lesson", "Teach this lesson as structured notes: a short intro, one section per sub-topic with a small example (code where relevant), common mistakes, and a 5-question self-check with answers at the end."],
      exercise: ["Give me an exercise", "Give me one hands-on exercise for this lesson with expected output and two hints, but no solution."],
      quiz: ["Quiz me", "Write 4 multiple-choice questions on this lesson's sub-topics, then list the answers with one-line explanations under 'Answers'."]
    };
    const tutor = chatBox(() => ctx, quick);
    if (!l.full) {
      const subDone = l.sub.filter((_, j) => S.subs[k + "-" + j]).length;
      return { html: `<div class="wrap">${crumbs}
        <header class="lesson-head"><span class="tag" style="--lvc: var(--accent)">${esc(m.t)}</span><h1>${esc(l.t)}</h1></header>
        <div class="banner soft"><div><b>Lesson outline</b><p>The full written lesson (notes, code, exercise and quiz) is coming in a later update. Use this outline as your study checklist: learn each point from official documentation, tick it off, and prove it with the module's lab.</p></div><a class="btn btn-line" href="#mod-${m.id}">Module lab</a></div>
        <section class="panel"><div class="section-h"><h2>What this lesson covers</h2><span class="note">${subDone} of ${l.sub.length}</span></div>
          <ul class="checks">${l.sub.map((s, j) => `<li><label><input type="checkbox" data-sub="${k}-${j}" ${S.subs[k + "-" + j] ? "checked" : ""}><span>${esc(s)}</span></label></li>`).join("")}</ul></section>
        ${tutor.html}${notesBox}${foot}${footer()}</div>`, bind() { tutor.bind(); bindLessonCommon(k, next); } };
    }
    const L = l.l, chosen = S.quiz[k];
    return { html: `<div class="wrap">${crumbs}
      <header class="lesson-head"><span class="tag" style="--lvc: var(--accent)">${esc(m.t)}</span><h1>${esc(L.t)}</h1></header>
      <section class="subs"><span class="eyebrow">Sub-topics in this lesson</span><ul>${L.sub.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></section>
      <section class="prose"><span class="eyebrow">Notes</span>${safe(L.body)}</section>
      <section class="code"><div class="code-bar"><span>${esc(L.lang)}</span><button type="button" id="copyBtn">Copy code</button></div><pre><code id="codeEl"></code></pre></section>
      ${tutor.html}
      <section class="panel"><div class="section-h"><h2>Exercise</h2></div>
        <div class="prose"><p>${safe(L.ex)}</p></div>
        <textarea class="mono" id="answerBox" rows="7" placeholder="Write or paste your solution here. It is saved as you type.">${esc(S.answers[k] || "")}</textarea>
        <div class="row-btns" data-tutor hidden><button class="btn btn-primary" type="button" id="reviewBtn">Review my answer</button><button class="btn btn-quiet" type="button" id="hintBtn">Give me a hint</button></div>
        <p class="hint" data-tutor-off>Run your solution, then compare it with the lesson's example. Stuck? Re-read the sub-topics and try a smaller version first.</p>
        <div class="tutor-out" id="exOut"></div></section>
      <section class="panel"><div class="section-h"><h2>Quiz</h2>${chosen !== undefined ? '<button class="btn btn-line" type="button" id="retryQuiz">Try again</button>' : ""}</div>
        <p class="quiz-q" style="margin:0">${safe(L.q[0])}</p>
        <div class="opts">${L.q[1].map((o, j) => { const cls = chosen === undefined ? "" : j === L.q[2] ? "right" : j === chosen ? "wrong" : ""; return `<button type="button" class="opt ${cls}" data-opt="${j}" ${chosen !== undefined ? "disabled" : ""}><b>${"ABCD"[j]}</b><span>${safe(o)}</span></button>`; }).join("")}</div>
        ${chosen !== undefined ? `<div class="verdict ${chosen === L.q[2] ? "ok" : "no"}"><b>${chosen === L.q[2] ? "Correct." : "Not quite."}</b> ${esc(L.q[3])}</div>` : ""}</section>
      ${notesBox}${foot}
    </div>`, bind() {
      const codeEl = $("#codeEl"); codeEl.textContent = L.code;
      const lang = LANG[L.lang] || "plaintext";
      if (window.hljs && lang !== "plaintext" && hljs.getLanguage(lang)) { codeEl.className = "language-" + lang; try { hljs.highlightElement(codeEl); } catch (e) {} }
      $("#copyBtn").addEventListener("click", async (e) => {
        try { await navigator.clipboard.writeText(L.code); e.target.textContent = "Copied"; }
        catch (err) { const rg = document.createRange(); rg.selectNodeContents(codeEl); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); e.target.textContent = "Selected, press Ctrl+C"; }
        setTimeout(() => (e.target.textContent = "Copy code"), 1800);
      });
      let typing;
      $("#answerBox").addEventListener("input", (e) => { S.answers[k] = e.target.value; clearTimeout(typing); typing = setTimeout(save, 600); });
      document.querySelectorAll("[data-opt]").forEach((b) => b.addEventListener("click", () => { S.quiz[k] = +b.dataset.opt; save(); keepScroll(); }));
      const rq = $("#retryQuiz"); if (rq) rq.addEventListener("click", () => { delete S.quiz[k]; save(); keepScroll(); });
      const extra = () => Array.from(document.querySelectorAll("#reviewBtn, #hintBtn"));
      tutor.bind(extra); bindLessonCommon(k, next);
      if (!sample) return;
      const all = () => Array.from(document.querySelectorAll("#askBtn, [data-quick]")).concat(extra());
      $("#reviewBtn").addEventListener("click", () => {
        const a = $("#answerBox").value.trim();
        if (!a) { $("#exOut").innerHTML = '<p class="note">Write your answer in the box first, then ask for a review.</p>'; return; }
        ask($("#exOut"), `${ctx}\n\nExercise: ${plain(L.ex)}\n\nThe learner's answer:\n${a.slice(0, 12000)}\n\nReview it like a kind senior engineer: what is correct, bugs or misunderstandings with fixes, one improvement, and a verdict: "Ready to move on" or "Revise and resubmit".`, all(), { cache: false });
      });
      $("#hintBtn").addEventListener("click", () => ask($("#exOut"), `${ctx}\n\nExercise: ${plain(L.ex)}\n\nGive one helpful hint without giving away the solution. Two to four sentences.`, all()));
    } };
  }
  function bindLessonCommon(k, next) {
    let typing;
    $("#noteBox").addEventListener("input", (e) => { S.notes[k] = e.target.value; clearTimeout(typing); typing = setTimeout(save, 600); });
    const d = $("#doneBtn"); if (d) d.addEventListener("click", () => { S.done[k] = 1; save(); location.hash = next; });
    const u = $("#undoBtn"); if (u) u.addEventListener("click", () => { delete S.done[k]; save(); keepScroll(); });
  }

  /* ---------- router ---------- */
  let catFilter = "", areaJump = "";
  function keepScroll() { const y = scrollY; render(); scrollTo(0, y); }
  function bindIq(r) {
    const main = $("#main");
    main.querySelectorAll("[data-iq]").forEach((b) => b.addEventListener("click", () => {
      if (!sample) return;
      ask($("#iqOut"), `${BASE}\n\nRole: ${r.base ? r.base.title : r.title}. Help me practise this interview question: "${r.interview[+b.dataset.iq]}". Give the key points a strong answer covers, a model answer in about 150 words, and two follow-up questions.`, Array.from(main.querySelectorAll("[data-iq]")));
      $("#iqOut").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }));
  }
  function render() {
    const h = location.hash || "#home";
    const main = $("#main");
    let mm, m, view = null;
    if ((mm = h.match(/^#l-([a-z0-9-]+)\.(\d+)$/)) && (m = modById(mm[1])) && lessonAt(m, +mm[2])) {
      view = viewLesson(m, +mm[2]);
      if (S.last !== h) { S.last = h; save(); }
    } else if ((mm = h.match(/^#mod-([a-z0-9-]+)$/)) && (m = modById(mm[1]))) {
      view = viewModule(m);
    } else if ((mm = h.match(/^#r-([a-z-]+)$/)) && roleOf(mm[1]) && mm[1] !== "my") {
      const r = roleOf(mm[1]);
      if (S.ctx !== r.id) { S.ctx = r.id; save(); }
      main.innerHTML = viewRole(r);
      const pk = $("#pickRole"); if (pk) pk.addEventListener("click", () => { S.role = r.id; S.ctx = "my"; save(); renderTree($("#search").value); render(); });
      bindIq(r);
    } else if (h === "#my") {
      if (S.ctx !== "my") { S.ctx = "my"; save(); }
      main.innerHTML = viewRole(myRole());
      main.querySelectorAll("[data-base]").forEach((b) => b.addEventListener("click", () => { S.role = b.dataset.base; save(); renderTree($("#search").value); keepScroll(); }));
      bindIq(myRole());
    } else if (h === "#catalog") {
      main.innerHTML = viewCatalog();
      const box = $("#catSearch"); box.value = catFilter;
      const apply = () => { const q = box.value.trim().toLowerCase(); catFilter = box.value;
        main.querySelectorAll(".skill").forEach((c) => { c.hidden = !!q && !c.dataset.skill.includes(q); });
        main.querySelectorAll(".area-block").forEach((sec) => { sec.hidden = !sec.querySelector(".skill:not([hidden])"); }); };
      box.addEventListener("input", apply); apply();
      if (areaJump) { const el = document.getElementById("area-" + areaJump); areaJump = ""; if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 0); }
    } else if (h === "#roles") { main.innerHTML = viewRoles();
    } else if (h === "#projects") {
      main.innerHTML = viewProjects();
      main.querySelectorAll("[data-prole]").forEach((b) => b.addEventListener("click", () => { projRole = b.dataset.prole; render(); }));
    } else if (h === "#library") {
      main.innerHTML = viewLibrary();
      const box = $("#libSearch");
      box.addEventListener("input", () => { const q = box.value.trim().toLowerCase();
        main.querySelectorAll("[data-lib]").forEach((r) => { r.hidden = !!q && !r.dataset.lib.includes(q); });
        main.querySelectorAll(".lib-block").forEach((s) => { s.hidden = !s.querySelector("[data-lib]:not([hidden])"); }); });
    } else if (h === "#about") { main.innerHTML = viewAbout();
    } else { main.innerHTML = viewHome(); }
    if (view) { main.innerHTML = view.html; view.bind(); }
    main.querySelectorAll("[data-sub]").forEach((c) => c.addEventListener("change", () => { S.subs[c.dataset.sub] = c.checked ? 1 : 0; save(); keepScroll(); }));
    main.querySelectorAll("[data-lab]").forEach((c) => c.addEventListener("change", () => { S.labs[c.dataset.lab] = c.checked ? 1 : 0; save(); keepScroll(); }));
    main.querySelectorAll("[data-jr]").forEach((c) => c.addEventListener("change", () => { S.jr[c.dataset.jr] = c.checked ? 1 : 0; save(); keepScroll(); }));
    main.querySelectorAll("[data-pj]").forEach((c) => c.addEventListener("change", () => { S.pj[c.dataset.pj] = c.checked ? 1 : 0; save(); }));
    main.querySelectorAll("[data-addpath]").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); addToPath(b.dataset.addpath); renderTree($("#search").value); keepScroll(); }));
    main.querySelectorAll("[data-unpath]").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); removeFromPath(b.dataset.unpath); renderTree($("#search").value); keepScroll(); }));
    main.querySelectorAll("[data-repath]").forEach((b) => b.addEventListener("click", () => { addToPath(b.dataset.repath); renderTree($("#search").value); keepScroll(); }));
    main.querySelectorAll("[data-area-jump]").forEach((a) => a.addEventListener("click", (e) => { areaJump = a.dataset.areaJump; if (location.hash === "#catalog") { e.preventDefault(); const el = document.getElementById("area-" + areaJump); areaJump = ""; if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); } }));
    showTutor(); paintProgress(); markActive();
  }
  let lastHash = null;
  function route() { render(); if (location.hash !== lastHash) { window.scrollTo(0, 0); lastHash = location.hash; } }
  window.addEventListener("hashchange", route);

  if (!ROLES.length || !MODS.length) { $("#main").innerHTML = '<div class="wrap"><p class="note">The course content did not load. Reload the page.</p></div>'; return; }
  renderTree();
  route();
})();

</script>

</body>
</html>
